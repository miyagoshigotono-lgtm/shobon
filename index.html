<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=0.8, user-scalable=yes, minimum-scale=0.5, maximum-scale=2.0">
  <title>ねこのアクション</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ねこのアクション">
  <meta name="theme-color" content="#111111">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #fff;
      overflow: hidden;
      font-family: 'Courier New', monospace;
      touch-action: none;
      user-select: none;
    }

    #gameContainer {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    canvas {
      display: block;
    }

    #hud {
      position: fixed;
      top: 12px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 10px;
      pointer-events: none;
      z-index: 10;
    }

    #deathCount,
    #stageLabel,
    #timeLeft {
      font-family: 'Courier New', monospace;
      font-size: clamp(10px, 2.6vw, 13px);
      color: #333;
      letter-spacing: 1px;
      background: rgba(255, 255, 255, 0.9);
      padding: 4px clamp(6px, 2vw, 14px);
      border: 1px solid #bbb;
      white-space: nowrap;
    }

    #timeLeft.warning {
      color: #c0392b;
      border-color: #c0392b;
    }

    #backStageBtn {
      font-family: 'Courier New', monospace;
      font-size: clamp(9px, 2.4vw, 11px);
      letter-spacing: 1px;
      color: #666;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid #ccc;
      padding: 5px clamp(6px, 2vw, 12px);
      cursor: pointer;
      pointer-events: auto;
      white-space: nowrap;
      transition: all .15s;
    }

    #backStageBtn:hover,
    #backStageBtn:active {
      color: #c0392b;
      border-color: #c0392b;
      background: rgba(255, 255, 255, 0.95);
    }

    body.finalZone #deathCount,
    body.finalZone #stageLabel,
    body.finalZone #timeLeft {
      background: rgba(0, 0, 0, 0.85);
      color: #eee;
      border-color: #555;
    }

    #deathMessage {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Courier New', monospace;
      font-size: clamp(18px, 5vw, 28px);
      color: #111;
      letter-spacing: 3px;
      text-align: center;
      pointer-events: none;
      z-index: 20;
      opacity: 0;
      transition: opacity 0.15s;
      white-space: nowrap;
    }

    body.finalZone #deathMessage {
      color: #eee;
    }

    #deathMessage.show {
      opacity: 1;
    }

    #titleScreen {
      position: fixed;
      inset: 0;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
    }

    #titleScreen h1 {
      font-family: 'Courier New', monospace;
      font-size: clamp(20px, 6vw, 36px);
      letter-spacing: 4px;
      color: #111;
      margin-bottom: 8px;
    }

    #titleScreen p {
      font-family: 'Courier New', monospace;
      font-size: clamp(10px, 3vw, 14px);
      color: #888;
      letter-spacing: 2px;
      margin-bottom: 40px;
    }

    #titleCat {
      margin-bottom: 32px;
    }

    .menuBtn {
      font-family: 'Courier New', monospace;
      font-size: clamp(13px, 4vw, 18px);
      letter-spacing: 4px;
      color: #111;
      background: none;
      border: 2px solid #111;
      padding: 12px 32px;
      cursor: pointer;
      transition: background .15s, color .15s;
    }

    .menuBtn:active,
    .menuBtn:hover {
      background: #111;
      color: #fff;
    }

    #stageSelectScreen {
      position: fixed;
      inset: 0;
      background: #fff;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
    }

    #stageSelectScreen h2 {
      font-family: 'Courier New', monospace;
      font-size: clamp(18px, 5vw, 32px);
      letter-spacing: 4px;
      color: #111;
      margin-bottom: 40px;
    }

    #stageGrid {
      display: grid;
      grid-template-columns: repeat(3, minmax(70px, 1fr));
      gap: 18px;
      margin-bottom: 40px;
      padding: 0 20px;
      max-width: 360px;
    }

    .stageBtn {
      font-family: 'Courier New', monospace;
      font-size: clamp(16px, 4vw, 24px);
      letter-spacing: 2px;
      color: #111;
      background: none;
      border: 2px solid #111;
      padding: 20px;
      cursor: pointer;
      transition: background .15s, color .15s;
      min-width: 80px;
    }

    .stageBtn:active,
    .stageBtn:hover {
      background: #111;
      color: #fff;
    }

    #backToTitleBtn {
      font-family: 'Courier New', monospace;
      font-size: clamp(12px, 3vw, 16px);
      letter-spacing: 2px;
      color: #888;
      background: none;
      border: 1px solid #ccc;
      padding: 8px 20px;
      cursor: pointer;
      transition: all .15s;
    }

    #backToTitleBtn:active,
    #backToTitleBtn:hover {
      color: #111;
      border-color: #111;
    }

    #stageClearScreen,
    #clearScreen,
    #timeUpScreen {
      position: fixed;
      inset: 0;
      background: #fff;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 40;
    }

    #timeUpScreen h2 {
      font-family: 'Courier New', monospace;
      font-size: clamp(22px, 6vw, 40px);
      letter-spacing: 4px;
      color: #111;
      margin-bottom: 16px;
    }

    #timeUpScreen p {
      font-family: 'Courier New', monospace;
      font-size: clamp(11px, 3vw, 15px);
      color: #555;
      letter-spacing: 2px;
      margin-bottom: 12px;
      text-align: center;
    }

    #timeUpScreen p.last {
      margin-bottom: 40px;
    }

    #timeUpCatWrap {
      margin-bottom: 24px;
    }

    #clearScreen.dark {
      background: #0a0a0a;
    }

    #clearScreen.dark h2 {
      color: #f0f0f0;
    }

    #clearScreen.dark p {
      color: #aaa;
    }

    #clearScreen.dark .menuBtn {
      color: #f0f0f0;
      border-color: #f0f0f0;
    }

    #stageClearScreen h2,
    #clearScreen h2 {
      font-family: 'Courier New', monospace;
      font-size: clamp(22px, 6vw, 40px);
      letter-spacing: 4px;
      color: #111;
      margin-bottom: 16px;
    }

    #stageClearScreen p,
    #clearScreen p {
      font-family: 'Courier New', monospace;
      font-size: clamp(11px, 3vw, 15px);
      color: #555;
      letter-spacing: 2px;
      margin-bottom: 40px;
    }

    #updateNotification {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: none;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.8);
      padding: 30px;
      border-radius: 8px;
      text-align: center;
    }

    #updateNotification.show {
      display: block;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.9);
      }
      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    #updateContent p {
      color: #fff;
      font-size: 18px;
      margin-bottom: 20px;
      font-family: 'Courier New', monospace;
    }

    #updateContent button {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
    }

    #updateContent button:active {
      background: #45a049;
    }

    #controller {
      --btn-size: clamp(96px, 13vh, 140px);
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 8px;
      padding: 0 8px 16px;
      z-index: 10;
      pointer-events: none;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.3), transparent);
    }

    .ctrl-group {
      display: flex;
      gap: 12px;
      pointer-events: all;
    }

    .ctrl-btn {
      height: var(--btn-size);
      background: rgba(255, 255, 255, 0.15);
      border: 3px solid rgba(255, 255, 255, 0.4);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 66px;
      color: #fff;
      cursor: pointer;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      transition: background .08s;
      flex-shrink: 0;
    }

    body.finalZone .ctrl-btn {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.3);
      color: #eee;
    }

    .ctrl-btn.pressed,
    .ctrl-btn:active {
      background: rgba(255, 255, 255, 0.3);
    }

    #leftBtn,
    #rightBtn {
      font-size: 80px;
    }

    #jumpBtn {
      width: var(--btn-size);
      flex: 0 0 auto;
    }

    /* 左右キー: 高さと同じ幅の正方形、画面左寄せ */
    #dpad {
      gap: 0;
      flex: 0 0 auto;
    }
    #dpad #leftBtn {
      border-right: none;
      border-top-right-radius: 0;
      border-bottom-right-radius: 0;
      width: var(--btn-size);
      flex: 0 0 auto;
    }
    #dpad #rightBtn {
      border-top-left-radius: 0;
      border-bottom-left-radius: 0;
      width: var(--btn-size);
      flex: 0 0 auto;
    }
  </style>
</head>

<body>
  <audio id="bgm" src="bgm.mp3" loop preload="auto"></audio>
  <div id="gameContainer"><canvas id="gameCanvas"></canvas></div>
  <div id="hud">
    <div id="stageLabel">STAGE 1</div>
    <div id="deathCount">死亡 : 0</div>
    <div id="timeLeft">のこり 20:00</div>
    <button id="backStageBtn" onclick="backToStageSelect()">ステージせんたく</button>
  </div>
  <div id="deathMessage">ハッ‥ハッ‥ハ・・・。</div>

  <div id="titleScreen">
    <div id="titleCat"><canvas id="titleCatCanvas" width="64" height="64"></canvas></div>
    <h1>ねこのアクション</h1>
    <p>ゆっくりしていってね！！！<br>（あそべるのは 20ぷん まで）</p>
    <button class="menuBtn" onclick="showStageSelect()">はじめる</button>
  </div>

  <div id="stageSelectScreen">
    <h2>ステージをえらぶ</h2>
    <div id="stageGrid">
      <button class="stageBtn" onclick="startStageFromSelect(1)">1</button>
      <button class="stageBtn" onclick="startStageFromSelect(2)">2</button>
      <button class="stageBtn" onclick="startStageFromSelect(3)">3</button>
      <button class="stageBtn" onclick="startStageFromSelect(4)">4</button>
      <button class="stageBtn" onclick="startStageFromSelect(5)">5</button>
      <button class="stageBtn" onclick="startStageFromSelect(6)">6</button>
      <button class="stageBtn" onclick="startStageFromSelect(7)">7</button>
    </div>
    <button id="backToTitleBtn" onclick="backToTitleFromSelect()">もどる</button>
  </div>

  <div id="timeUpScreen">
    <div id="timeUpCatWrap"><canvas id="timeUpCatCanvas" width="64" height="64"></canvas></div>
    <h2>20ぷん たちました</h2>
    <p>ゲームの やりすぎは よくない。<br>ネコと いっしょに ひとやすみ しよう。</p>
    <p class="last" id="timeUpMsg">きょうの 死亡回数 : 0</p>
    <button class="menuBtn" onclick="backToTitle()">きゅうけいする</button>
  </div>

  <div id="stageClearScreen">
    <h2 id="stageClearTitle">STAGE 1 クリア！</h2>
    <p id="stageClearMsg">死亡回数 : 0</p>
    <button class="menuBtn" id="nextStageBtn" onclick="goNextStage()">STAGE 2 へ</button>
  </div>

  <div id="clearScreen">
    <h2 id="clearTitle">全ステージクリア！</h2>
    <p id="clearMsg">総死亡回数 : 0</p>
    <button class="menuBtn" id="clearBtn" onclick="restartGame()">もういちど</button>
  </div>

  <div id="updateNotification">
    <div id="updateContent">
      <p>アップデートがあります</p>
      <button onclick="reloadForUpdate()">アップデート</button>
    </div>
  </div>

  <div id="controller">
    <div class="ctrl-group" id="dpad">
      <div class="ctrl-btn" id="leftBtn">◀</div>
      <div class="ctrl-btn" id="rightBtn">▶</div>
    </div>
    <div class="ctrl-group">
      <div class="ctrl-btn" id="jumpBtn">▲</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resize(); window.addEventListener('resize', resize);

    const TILE = 32, GRAVITY = 0.55, JUMP_FORCE = -12.5, MOVE_SPEED = 3.2, CAT_W = 26, CAT_H = 28, GY = 480;
    const STAGE_MAX = 7;
    const FLAP_GRAV = 0.34, FLAP_IMPULSE = -6.2, FLAP_SPEED = 2.6;
    const PLAY_LIMIT_MS = 20 * 60 * 1000;   // やりすぎ防止: 20分でおしまい
    let playTimeMs = 0;
    let state = 'title', currentStage = 1, deathCount = 0, camera = { x: 0 }, IS_DEAD = false;

    // ステージ3〜5用のグローバル状態
    let gravityDir = 1;                 // 1=通常 / -1=天井歩き (VVVVVV)
    let activeMode = 'normal';          // normal / vvvvvv / flappy / reversed
    let zones = [];                     // {x1,x2,type}
    let enemies = [], decorations = [];
    let battleActive = false, battle = null;   // Undertale風バトル
    let rhythmActive = false, rhythm = null;   // リズム天国風 コール&レスポンス
    let mgActive = false, mg = null;           // ステージ7のミサイル2種
    let rhythmPresses = [];                    // ▲を押したAudioContext時刻のキュー
    let lastRhythmStats = null;                // 直近の成績 (デバッグ/確認用)
    let freezeTimer = 0, shakeTimer = 0;
    let glitchActive = false, invert = false;
    let stage5Final = false;            // 偽エンディング後の「ほんとうのさいご」
    let trueGoal = null;
    let introTimer = 0, introTitle = '', introSub = '';
    let frameCount = 0;
    let diedInBattle = false;

    const DEATH_MSGS = {
      1: 'ハッ‥ハッ‥ハ・・・。',
      2: 'ハッ‥ハッ‥ハ・・・。',
      3: 'じゅうりょくは むじひ である。',
      4: 'ネコの たましいが くだけちった。',
      5: '※ このさきに セーブポイントは ない。',
      6: 'リズムに のれなかった。',
      7: 'ひだりと みぎを まちがえた。'
    };
    const STAGE_INTROS = {
      3: ['STAGE 3', '「じゅうりょく、はんてん。」'],
      4: ['STAGE 4', '「たましいの いろ」'],
      5: ['STAGE 5', '「このゲームは あなたを しっている」'],
      6: ['STAGE 6', '「アンコール」'],
      7: ['STAGE 7', '「ひだりは みぎ、みぎは ひだり」']
    };

    // オーディオ
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let actx = null;
    function initAudio() {
      if (!actx) actx = new AudioContext();
      const bgm = document.getElementById('bgm');
      bgm.volume = 0.20;
      if (bgm.paused) bgm.play().catch(() => { });
    }
    function restartBgm() {
      const bgm = document.getElementById('bgm');
      bgm.currentTime = 0;
      bgm.play().catch(() => { });
    }
    function playTone(freq, type, duration, vol = 0.1) {
      if (!actx) return;
      const osc = actx.createOscillator(); const gain = actx.createGain();
      osc.type = type; osc.frequency.setValueAtTime(freq, actx.currentTime);
      gain.gain.setValueAtTime(vol, actx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + duration);
      osc.connect(gain); gain.connect(actx.destination);
      osc.start(); osc.stop(actx.currentTime + duration);
    }
    // 指定した「AudioContextの絶対時刻」に鳴らす (リズムゲーム用: サンプル単位で正確)
    function playToneAt(freq, type, duration, vol, when) {
      if (!actx) return;
      // 予約時刻が過去だと例外になる (アプリを裏に回して戻した直後など)
      const t = Math.max(when, actx.currentTime);
      const osc = actx.createOscillator(), gain = actx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(vol, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
      osc.connect(gain); gain.connect(actx.destination);
      osc.start(t); osc.stop(t + duration);
    }
    function playJump() { initAudio(); if (!actx) return; const o = actx.createOscillator(); o.frequency.setValueAtTime(300, actx.currentTime); o.frequency.linearRampToValueAtTime(600, actx.currentTime + 0.1); const g = actx.createGain(); g.gain.value = 0.05; g.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.1); o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + 0.1); }
    function playDeath() { playTone(150, 'sawtooth', 0.5, 0.1); playTone(100, 'square', 0.6, 0.1); }
    function playShoot() { playTone(800, 'square', 0.1, 0.05); }
    function playHit() { playTone(200, 'sawtooth', 0.1, 0.1); }
    function playFlip() { playTone(500, 'triangle', 0.12, 0.07); playTone(750, 'triangle', 0.12, 0.05); }
    function playCoin() { playTone(990, 'square', 0.08, 0.06); setTimeout(() => playTone(1320, 'square', 0.25, 0.06), 70); }
    function playError() { playTone(880, 'square', 0.25, 0.09); setTimeout(() => playTone(660, 'square', 0.35, 0.09), 180); }
    function playWarp() { playTone(400, 'sine', 0.1, 0.08); setTimeout(() => playTone(800, 'sine', 0.15, 0.08), 80); }
    function playGlitch() { playTone(120 + Math.random() * 600, 'sawtooth', 0.06, 0.05); }

    // 入力
    const keys = { left: false, right: false };
    let jumpPressed = false, jumpUsed = false, duckUsed = false, duckHeld = false;

    // ▲を押した瞬間。リズムモード中は「押した時刻」を音の時計で記録する
    function onJumpDown() {
      if (rhythmActive) { rhythmPresses.push({ t: actx ? actx.currentTime : 0, act: 'jump' }); return; }
      jumpPressed = true; playJump();
    }
    // ◀▶ を押した瞬間 = しゃがむ (リズムモード中だけ意味を持つ)
    function onDuckDown() {
      if (!rhythmActive) return;
      rhythmPresses.push({ t: actx ? actx.currentTime : 0, act: 'duck' });
    }
    document.addEventListener('keydown', e => {
      if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
      if (e.key === 'ArrowLeft' || e.key === 'a') { if (!keys.left) onDuckDown(); keys.left = true; }
      if (e.key === 'ArrowRight' || e.key === 'd') { if (!keys.right) onDuckDown(); keys.right = true; }
      if ((e.key === 'ArrowDown' || e.key === 's') && !duckUsed) { duckUsed = true; onDuckDown(); }
      if ((e.key === 'ArrowUp' || e.key === ' ' || e.key === 'z') && !jumpUsed) { jumpUsed = true; onJumpDown(); }
    });
    document.addEventListener('keyup', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
      if (e.key === 'ArrowDown' || e.key === 's') duckUsed = false;
      if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'z') jumpUsed = false;
    });
    const dpadEl = document.getElementById('dpad');
    const lBtn = document.getElementById('leftBtn');
    const rBtn = document.getElementById('rightBtn');

    function handleDPadTouch(e) {
      e.preventDefault();
      let l = false, r = false;
      for (let i = 0; i < e.touches.length; i++) {
        const touch = e.touches[i];
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        if (target === lBtn) l = true;
        if (target === rBtn) r = true;
      }
      keys.left = l; keys.right = r;
      lBtn.classList.toggle('pressed', l);
      rBtn.classList.toggle('pressed', r);
      // 押した瞬間だけを拾う (リズム中の「しゃがむ」入力)
      const anyDown = l || r;
      if (anyDown && !duckHeld) onDuckDown();
      duckHeld = anyDown;
    }

    dpadEl.addEventListener('touchstart', handleDPadTouch, { passive: false });
    dpadEl.addEventListener('touchmove', handleDPadTouch, { passive: false });
    dpadEl.addEventListener('touchend', handleDPadTouch, { passive: false });
    dpadEl.addEventListener('touchcancel', handleDPadTouch, { passive: false });
    const jumpBtn = document.getElementById('jumpBtn');
    jumpBtn.addEventListener('touchstart', e => { e.preventDefault(); jumpBtn.classList.add('pressed'); if (!jumpUsed) { jumpUsed = true; onJumpDown(); } }, { passive: false });
    jumpBtn.addEventListener('touchend', e => { e.preventDefault(); jumpBtn.classList.remove('pressed'); jumpUsed = false; }, { passive: false });

    // プレイヤー
    let player = {};
    function resetPlayer(sx, sy) { player = { x: sx, y: sy, vx: 0, vy: 0, onGround: false, facingRight: true, alive: true, frame: 0, frameTimer: 0 }; }

    // ステージオブジェクト
    let platforms = [], hazards = [], goalObj = null, movingObjects = [], projectiles = [], pitSpikes = [];
    let worldWidth = 0, trap = {}, trap2 = {}, trap3 = {}, trap4 = {}, trap5 = {}, trap6 = {}, trap7 = {};

    // ヘルパー
    function addSolid(x, y, w = TILE, h = TILE) { platforms.push({ x, y, w, h, type: 'solid', visible: true }); }
    function addFakeFloor(x, y, w = TILE, h = TILE) { platforms.push({ x, y, w, h, type: 'fake_floor', visible: true }); }
    function addCrushBlock(x, y, w, h) { platforms.push({ x, y, w, h, type: 'crush', visible: true, falling: false, vy: 0, triggered: false }); }
    function addMovingPlatform(x, y, w, h, id) { platforms.push({ x, y, w, h, type: 'moving', id, visible: true }); }
    function addMovingSpike(x, y, w, h, id) { hazards.push({ x, y, w, h, type: 'moving_spike', id, visible: true }); }
    function addCeilingSpike(x, y, w, h, id = '') { movingObjects.push({ x, y, w, h, type: 'ceiling_spike', id, visible: false, vy: 0, active: false, done: false }); }
    function addFloorSpike(x, y, w, h) { movingObjects.push({ x, y, w, h, type: 'floor_spike', visible: false, active: false, targetY: 0 }); }
    function addFakeGoal(x, y) { movingObjects.push({ x, y, type: 'fake_goal', triggered: false }); }
    function addDynamicIsland(x, y, w, h, id) { platforms.push({ x, y, w, h, type: 'dynamic', id, visible: true, landed: false, fallTimer: 0, falling: false, vy: 0, flying: false, flyVx: 0 }); }
    function addOscIsland(x, y, w, h, id, axis, amp, speed) { platforms.push({ x, y, w, h, type: 'oscil', id, visible: true, baseX: x, baseY: y, axis, amp, speed, phase: Math.random() * Math.PI * 2 }); }
    function addStaticSpike(x, y, w, h, opts = {}) { hazards.push(Object.assign({ x, y, w, h, type: 'static_spike', visible: true }, opts)); }
    function addRoamSpike(x, y, w, h, id, minX, maxX, spd) { hazards.push({ x, y, w, h, type: 'roam_spike', id, visible: true, minX, maxX, speed: spd, dir: 1 }); }
    function addSign(x, y, text) { decorations.push({ type: 'sign', x, y, text }); }
    function addQBlock(x, y, content) { platforms.push({ x, y, w: TILE, h: TILE, type: 'qblock', content, used: false, bounce: 0, visible: true }); }
    function addThwomp(x, baseY, w, h) { movingObjects.push({ type: 'thwomp', x, y: baseY, baseY, w, h, state: 'idle', vy: 0, waitTimer: 0, visible: true, active: true }); }
    function addPipePair(x, gapCenterY, gapHalf) {
      hazards.push({ x, y: -80, w: 2 * TILE, h: gapCenterY - gapHalf + 80, type: 'pipe', visible: true });
      hazards.push({ x, y: gapCenterY + gapHalf, w: 2 * TILE, h: GY + 6 * TILE - (gapCenterY + gapHalf), type: 'pipe', visible: true });
    }
    function addInvisibleBlock(x, y, w = TILE, h = TILE) { platforms.push({ x, y, w, h, type: 'invisible', visible: false }); }

    function setIntro(stage) {
      const it = STAGE_INTROS[stage];
      if (it) { introTimer = 150; introTitle = it[0]; introSub = it[1]; }
      else introTimer = 0;
    }

    // ============================================================
    // ステージ1
    // ============================================================
    function buildStage1() {
      platforms = []; hazards = []; movingObjects = []; projectiles = []; pitSpikes = [];
      enemies = []; decorations = []; zones = []; trueGoal = null; glitchActive = false; invert = false;
      trap = {
        pitSpike: false, crushBlock: false, spikeIslandMoved: false, fakeGoalFired: false,
        ceilingSpikeDropped: false, floorRiseActive: false,
        islandAUp1: false, islandAUp2: false, islandAUp3: false, islandAFly: false
      };
      const S = TILE;

      for (let i = 0; i < 10; i++)addSolid(i * S, GY);                     // 島①
      for (let i = 12; i < 18; i++)addSolid(i * S, GY);                    // 島②
      addCrushBlock(13 * S, GY - 2 * S, 4 * S, S);
      for (let i = 20; i < 28; i++)addSolid(i * S, GY);                    // 島③
      hazards.push({ x: 22 * S, y: GY - 3 * S, w: 2 * S, h: S, type: 'spike_block', id: 'spikeIsland', visible: true });
      for (let i = 30; i < 41; i++)addSolid(i * S, GY);                    // 島④
      addCeilingSpike(30 * S, -S, 2 * S, S, 'ceilA');
      addCeilingSpike(34 * S, -S, 2 * S, S, 'ceilB');
      addFloorSpike(38 * S, GY + S, 2 * S, S);
      addSolid(43 * S, GY); addSolid(44 * S, GY);                        // 島⑤ 4島ギミック
      addDynamicIsland(46 * S, GY - 2 * S, 2 * S, S, 'islandA');
      addDynamicIsland(49 * S, GY - 3 * S, 2 * S, S, 'islandB');
      addDynamicIsland(52 * S, GY - 4 * S, 2 * S, S, 'islandC');
      addDynamicIsland(55 * S, GY - 3 * S, 2 * S, S, 'islandD');
      for (let i = 58; i < 69; i++)addSolid(i * S, GY);                    // 島⑥ ゴール前
      addFakeGoal(62 * S, GY - 4 * S);
      addFakeFloor(62 * S, GY, S, S); addFakeFloor(63 * S, GY, S, S); addFakeFloor(64 * S, GY, S, S);
      addFakeFloor(66 * S, GY, 2 * S, S);
      goalObj = { x: 68 * S, y: GY - 4 * S, w: S, h: 4 * S, poleKillH: 3 * S, flagY: GY - 4 * S, flagH: S };
      worldWidth = 70 * S;
    }

    // ============================================================
    // ステージ2 (完全リニューアル版・極悪仕様)
    // ============================================================
    function buildStage2() {
      platforms = []; hazards = []; movingObjects = []; projectiles = []; pitSpikes = [];
      enemies = []; decorations = []; zones = []; trueGoal = null; glitchActive = false; invert = false;
      trap2 = { invisHit: false, invisSpike: false, canonTimer: 0, canonIndex: 0, wallActive: false, goalRun: false };
      const S = TILE;

      // ①スタートと孔明の罠 (見えないブロック)
      for (let i = 0; i < 6; i++)addSolid(i * S, GY);
      // 穴: 6〜11 (5マス)
      // 左に1つ追加して3連にする
      platforms.push({ x: 6 * S, y: GY - 3.5 * S, w: S, h: S, type: 'invisible', visible: false });
      platforms.push({ x: 7 * S, y: GY - 3.5 * S, w: S, h: S, type: 'invisible', visible: false });
      platforms.push({ x: 8 * S, y: GY - 3.5 * S, w: S, h: S, type: 'invisible', visible: false });
      for (let i = 11; i < 15; i++)addSolid(i * S, GY);

      // ②極悪・崩れる床
      // 穴: 15〜26
      addDynamicIsland(16 * S, GY - 2 * S, S, S, 'fallA');
      addDynamicIsland(20 * S, GY - 3 * S, S, S, 'fallB');
      addDynamicIsland(24 * S, GY - 2 * S, S, S, 'fallC');

      // ③大砲エリア (床抜けあり＆すり抜け防止壁)
      for (let i = 26; i < 45; i++) {
        if ([30, 31, 35, 38, 39, 43].includes(i)) continue; // いやらしい位置の落とし穴
        addSolid(i * S, GY);
      }
      addSolid(45 * S, GY - 3 * S, S, 6 * S); // 下まで伸ばしてすり抜け落下を完全に防止

      // ④揺れる島（TAS仕様の再現）
      // 穴: 45〜56
      addOscIsland(47 * S, GY - 2 * S, 2 * S, S, 'oscB', 'y', 2 * S, 0.085);
      addStaticSpike(47 * S + S / 2, GY - 6 * S, S, S); // 1つ目のトゲだけ1ブロック高く (GY-5*S -> GY-6*S)

      addOscIsland(51 * S, GY - 3 * S, 2 * S, S, 'oscC', 'y', 2 * S, 0.09); // 元の動きに近づけるためy軸に変更
      addStaticSpike(51 * S + S / 2, GY - 5 * S, S, S);

      addOscIsland(55 * S, GY - 2 * S, 2 * S, S, 'oscD', 'y', 2.5 * S, 0.08);
      addStaticSpike(55 * S + S / 2, GY - 4 * S, S, S);

      // ⑤ゴール前 (迫りくる壁 ＆ 逃げるゴール ＆ 偽の壁の裏に落とし穴)
      for (let i = 56; i < 100; i++) {
        if (i >= 63 && i <= 65) continue; // 偽壁の直後の落とし穴
        if (i >= 86 && i <= 88) continue; // ゴールが逃げる途中の落とし穴
        addSolid(i * S, GY);
      }

      // 偽の壁 (見た目だけ壁で、すり抜けられる)
      platforms.push({ x: 61 * S, y: GY - 4 * S, w: 2 * S, h: 4 * S, type: 'fake_wall', visible: true });

      // 迫りくる巨大壁
      hazards.push({ x: 50 * S, y: GY - 15 * S, w: 3 * S, h: 15 * S, type: 'chase_wall', visible: false, active: false, speed: 3.1 }); // プレイヤーとほぼ同速

      // ゴール (80*Sに配置)
      goalObj = { x: 80 * S, y: GY - 4 * S, w: S, h: 4 * S, poleKillH: 3 * S, flagY: GY - 4 * S, flagH: S, running: false };
      worldWidth = 95 * S;
    }

    // ============================================================
    // トラップ更新 (1面)
    // ============================================================
    function updateTraps1() {
      const S = TILE, px = player.x, py = player.y;

      if (!trap.pitSpike && px + CAT_W > 11 * S && px < 12 * S && py < GY) {
        trap.pitSpike = true; firePitSpike(11 * S + S / 2, GY + S);
      }
      if (!trap.crushBlock) {
        for (const b of platforms) {
          if (b.type === 'crush' && !b.triggered && px + CAT_W > b.x && px < b.x + b.w && py > b.y + b.h && py < b.y + b.h + 2 * S) {
            b.triggered = true; b.falling = true; trap.crushBlock = true;
          }
        }
      }
      if (!trap.spikeIslandMoved) {
        for (const h of hazards) {
          if (h.id === 'spikeIsland') {
            if (Math.abs((player.x + CAT_W / 2) - (h.x + h.w / 2)) < 2 * TILE) {
              trap.spikeIslandMoved = true;
              h.x -= 2 * TILE;
              // 動いた結果プレイヤーと重なっていれば即死
              if (rectOverlap(player.x, player.y, CAT_W, CAT_H, h.x, h.y, h.w, h.h)) {
                killPlayer();
              }
            }
          }
        }
      }
      if (!trap.ceilingSpikeDropped && player.onGround && px > 32 * S && px < 33 * S) {
        trap.ceilingSpikeDropped = true;
        for (const m of movingObjects) { if (m.type === 'ceiling_spike') { m.active = true; m.visible = true; m.y = -S; m.vy = 16; } }
      }
      if (!trap.floorRiseActive && player.onGround && px > 37 * S && px < 38 * S) {
        trap.floorRiseActive = true;
        for (const m of movingObjects) { if (m.type === 'floor_spike') { m.active = true; m.visible = true; m.targetY = GY - S + 8; } }
      }
      updateIslandGimmick();
      checkFakeGoal(); checkGoal();
    }

    // ============================================================
    // トラップ更新 (2面)
    // ============================================================
    function updateTraps2() {
      const S = TILE, px = player.x, py = player.y;

      // 孔明の罠 (下や横からぶつかった時だけ落とす。上から乗った時は普通の足場に)
      revealInvisibleBlocks();

      // 見えないブロック上からのジャンプ迎撃トゲ (4ブロック上を横切る)
      const invisBlock = platforms.find(p => p.x === 6 * S && p.y === GY - 3.5 * S);
      if (invisBlock && invisBlock.visible) {
        // 透明ブロックの上に着地したら武装
        if (player.onGround && px >= 5 * S && px <= 9 * S && py <= GY - 3 * S) {
          trap2.invisArmed = true;
        }
        // 武装後にジャンプした瞬間に発射
        if (trap2.invisArmed && !trap2.invisSpike && player.vy < -5) {
          trap2.invisSpike = true;
          // 透明ブロック(GY-3.5*S)から4ブロック(4*S)上 = GY-7.5*S
          projectiles.push({ x: 14 * S, y: GY - 7.5 * S, w: 20, h: 20, vx: -14, vy: 0, type: 'cannonball' });
          playShoot();
        }
      }

      // 崩れる床 (猶予を極限まで短く)
      for (const p of platforms) {
        if (p.type === 'dynamic' && p.id && p.id.startsWith('fall') && !p.falling) {
          if (player.onGround && rectOverlap(px, py + CAT_H - 2, CAT_W, 4, p.x, p.y, p.w, S / 2)) {
            p.fallTimer = (p.fallTimer || 0) + 1;
            let limit = (p.id === 'fallC') ? 1 : 3;
            if (p.fallTimer > limit) { p.falling = true; playHit(); }
          } else {
            p.fallTimer = 0;
          }
        }
      }

      // 大砲 (x=24〜45にいるとき高速で撃つ、たまに下の軌道も撃つ)
      if (px > 24 * S && px < 45 * S) {
        trap2.canonTimer++;
        if (trap2.canonTimer > 45) {
          trap2.canonTimer = 0;
          const seq = ['up', 'down', 'up', 'up', 'down', 'down'];
          const current = seq[(trap2.canonIndex || 0) % seq.length];
          trap2.canonIndex = (trap2.canonIndex || 0) + 1;
          let yPos = current === 'up' ? GY - 2.5 * S - 10 : GY - S - 10;
          projectiles.push({ x: 45 * S, y: yPos, w: 16, h: 16, vx: -6.5, vy: 0, type: 'cannonball' });
          playShoot();
        }
      }

      // 迫りくる壁
      if (!trap2.wallActive && px > 58 * S) {
        trap2.wallActive = true;
        for (const h of hazards) {
          if (h.type === 'chase_wall') { h.active = true; h.visible = true; h.x = camera.x - 2 * S; }
        }
      }

      // 逃げるゴール (プレイヤーより速く逃げる！)
      if (!trap2.goalRun && px > 72 * S && goalObj.x < 92 * S) {
        goalObj.running = true;
        trap2.goalRun = true;
      }
      if (goalObj && goalObj.running) {
        goalObj.x += 3.5;
        if (goalObj.x > 93 * S) { goalObj.running = false; }
      }

      checkFakeGoal(); checkGoal();
    }

    // 見えないブロックの共通処理 (孔明の罠)
    function revealInvisibleBlocks() {
      const px = player.x, py = player.y;
      for (const p of platforms) {
        if (p.type === 'invisible' && !p.visible) {
          if (rectOverlap(px, py, CAT_W, CAT_H, p.x - 4, p.y - 4, p.w + 8, p.h + 8)) {
            p.visible = true; p.type = 'solid';
            if (py + CAT_H > p.y + 10) { // 上から乗った以外の判定（下や横から）
              player.vy = 2; player.vx = 0; // 勢いを殺して落とす
            }
            playHit();
          }
        }
      }
    }

    // ============================================================
    // ステージ3 「じゅうりょく、はんてん。」 (VVVVVV + Flappy Bird)
    // ============================================================
    function buildStage3() {
      platforms = []; hazards = []; movingObjects = []; projectiles = []; pitSpikes = [];
      enemies = []; decorations = []; zones = []; trueGoal = null; glitchActive = false; invert = false;
      trap3 = {};
      const S = TILE;

      // ①イントロ (普通のふりをする)

      zones.push({ x1: 18 * S, x2: 47.5 * S, type: 'vvvvvv' });

      for (let i = 18; i <= 47; i++)addSolid(i * S, GY - 6 * S);    // 天井
      addStaticSpike(24 * S, GY - 20, 2 * S, 20);                   // 床トゲ → 天井へ逃げろ
      addStaticSpike(28 * S, GY - 5 * S, 2 * S, 20, { down: true });// 天井トゲ → 床へ戻れ
      addStaticSpike(33 * S, GY - 20, 2 * S, 20);
      addStaticSpike(38 * S, GY - 5 * S, 2 * S, 20, { down: true });
      addStaticSpike(42 * S, GY - 20, 2 * S, 20);

      // ③小休止
      for (let i = 48; i <= 52; i++)addSolid(i * S, GY);
      addSign(49 * S, GY, 'つぎ、とぶ。');

      // ④フラッピー地帯 (勝手に進む。▲ではばたけ)
      zones.push({ x1: 53 * S, x2: 79 * S, type: 'flappy' });
      addPipePair(57 * S, GY - 4.5 * S, 68);
      addPipePair(63 * S, GY - 6 * S, 68);
      addPipePair(69 * S, GY - 3.5 * S, 68);
      addPipePair(75 * S, GY - 5.5 * S, 68);

      // ⑤ゴール前 (みえない何か、ある)
      for (let i = 79; i <= 88; i++)addSolid(i * S, GY);
      addStaticSpike(84 * S, GY - 20, S, 20);
      addInvisibleBlock(84 * S, GY - 3 * S);      // トゲを飛び越えると頭をぶつける
      goalObj = { x: 87 * S, y: GY - 4 * S, w: S, h: 4 * S, poleKillH: 3 * S, flagY: GY - 4 * S, flagH: S };

    }

    // ============================================================
    // ステージ4 「たましいの いろ」 (？ブロック + ドッスン + 弾幕戦闘)
    // ============================================================
    function buildStage4() {
      platforms = []; hazards = []; movingObjects = []; projectiles = []; pitSpikes = [];
      enemies = []; decorations = []; zones = []; trueGoal = null; glitchActive = false; invert = false;
      const wasBattleDone = trap4?.battleDone ? true : false;
      trap4 = { battleDone: wasBattleDone, canonTimer: 0, canonIndex: 0 };
      const S = TILE;

      // ①？ブロック地帯 (たたくと、ろくなことがない)
      for (let i = 0; i <= 8; i++)addSolid(i * S, GY);
      addQBlock(4 * S, GY - 4 * S, 'coin');
      addQBlock(5 * S, GY - 4 * S, 'mushroom');
      addQBlock(6 * S, GY - 4 * S, 'cointrap');
      // 穴: 9〜11
      for (let i = 12; i <= 23; i++)addSolid(i * S, GY);

      // ②ドッスン地帯
      addThwomp(15 * S - 8, GY - 5 * S, 48, 48);
      addThwomp(20 * S - 8, GY - 5 * S, 48, 48);
      addStaticSpike(17 * S, GY - 20, S, 20);

      // 穴: 24
      for (let i = 25; i <= 32; i++)addSolid(i * S, GY);

      // ③戦闘のとびら (28*S) と バリア (戦闘に勝つまで通れない)
      decorations.push({ type: 'door', x: 28 * S, y: GY - 3 * S });

        platforms.push({ x: 30 * S, y: GY - 6 * S, w: S, h: 6 * S, type: 'solid', visible: true, id: 'battleBarrier' });
      } else {
        // ボス戦クリア済みの場合、バリアがあれば削除
        platforms = platforms.filter(p => p.id !== 'battleBarrier');
      }

      // ④揺れる島の谷 (穴: 33〜39)
      addOscIsland(34 * S, GY - 2 * S, 2 * S, S, 'osc4A', 'y', 1.5 * S, 0.08);
      addOscIsland(37 * S, GY - 3 * S, 2 * S, S, 'osc4B', 'y', 1.5 * S, 0.09);

      // ⑤最終地帯 (徘徊トゲ + 偽ゴール + 偽床 + 大砲)
      for (let i = 40; i <= 52; i++) {
        if (i === 48 || i === 49) { addFakeFloor(i * S, GY, S, S); continue; }
        addSolid(i * S, GY);
      }
      addRoamSpike(42 * S, GY - 20, S, 20, 'roam4', 41 * S, 47 * S, 2.2);
