    // ============================================================
    // ステージ5 「このゲームは あなたを しっている」 (メタ全開)
    // ============================================================
    function buildStage5() {
      platforms = []; hazards = []; movingObjects = []; projectiles = []; pitSpikes = [];
      enemies = []; decorations = []; zones = []; trueGoal = null; glitchActive = false; invert = false;
      trap5 = { freezeDone: false, wallActive: false, ceilA: false, ceilB: false, warped: false };
      const S = TILE;

      // ①スタート地帯: 右は巨大壁。ゴールは「こっち→」…だが正解は左端の画面ワープ
      for (let i = 0; i <= 27; i++)addSolid(i * S, GY);
      addSolid(26 * S, GY - 8 * S, 2 * S, 8 * S);       // ジャンプでは絶対に越えられない壁
      addSign(22 * S, GY, 'ゴールは こっち →');
      addSign(4 * S, GY, '← しんじつ');

      // ②ワープ後: 操作反転地帯
      for (let i = 28; i <= 60; i++) {
        if (i >= 44 && i <= 46) continue;               // 反転中に飛ぶ穴
        addSolid(i * S, GY);
      }
      zones.push({ x1: 33 * S, x2: 52 * S, type: 'reversed' });
      addSign(31 * S, GY, '？？？');
      addStaticSpike(36 * S, GY - 20, S, 20);
      addStaticSpike(40 * S, GY - 20, 2 * S, 20);
      addStaticSpike(49 * S, GY - 20, S, 20);
      addSign(53 * S, GY, 'もう だいじょうぶ');

      // ③フリーズ事件 → エラーダイアログが足場になる
      // 穴: 61 / 壁: 62〜63 (エラーダイアログの上からしか越えられない)
      addSolid(62 * S, GY - 5 * S, 2 * S, 5 * S);

      // ④グリッチ地帯 (64〜82) : 床とトゲが信用できない
      for (let i = 64; i <= 82; i++) {
        if (i === 68 || i === 71) { addFakeFloor(i * S, GY, S, S); continue; }
        addSolid(i * S, GY);
      }
      decorations.push({ type: 'fakeSpike', x: 66 * S, y: GY - 20, w: S, h: 20 });
      decorations.push({ type: 'fakeSpike', x: 70 * S, y: GY - 20, w: S, h: 20 });
      addStaticSpike(73 * S, GY - 20, S, 20, { flicker: true });   // 本物 (ちらつく)

      // ⑤偽のゴール (触れると「全ステージクリア！」…)
      goalObj = { x: 79 * S, y: GY - 4 * S, w: S, h: 4 * S, poleKillH: 3 * S, flagY: GY - 4 * S, flagH: S };

      // ⑥ほんとうのさいご (偽エンディング後の色反転ゾーン)
      addSolid(85 * S, GY - 2 * S, S, S);
      addSolid(88 * S, GY - 3 * S, S, S);
      addSolid(91 * S, GY - 2 * S, S, S);
      addSolid(94 * S, GY - 4 * S, S, S);
      addSolid(97 * S, GY - 2 * S, S, S);
      for (let i = 99; i <= 108; i++)addSolid(i * S, GY);
      addCeilingSpike(101 * S, -S, 2 * S, S, 'final1');
      addCeilingSpike(104 * S, -S, 2 * S, S, 'final2');
      hazards.push({ x: 0, y: GY - 15 * S, w: 3 * S, h: 15 * S, type: 'chase_wall', visible: false, active: false, speed: 3.35 });
      worldWidth = 110 * S;
    }

    // ============================================================
    // ステージ6 「アンコール」 (リズム天国風 コール&レスポンス)
    // ============================================================
    function buildStage6() {
      platforms = []; hazards = []; movingObjects = []; projectiles = []; pitSpikes = [];
      enemies = []; decorations = []; zones = []; trueGoal = null; glitchActive = false; invert = false;
      const wasDone = trap6 && trap6.done ? true : false;
      const wasDone2 = trap6 && trap6.done2 ? true : false;
      trap6 = { done: wasDone, done2: wasDone2 };
      const S = TILE;

      // ①ステージそで (助走だけ。ここに理不尽は ない)
      for (let i = 0; i <= 46; i++)addSolid(i * S, GY);
      addSign(3 * S, GY, 'アンコール！');
      addSign(9 * S, GY, '▲で リズムを まねろ');

      // ②一曲目: まねっこ。勝つまで越えられない壁
      if (!trap6.done) {
        platforms.push({ x: 16 * S, y: GY - 6 * S, w: S, h: 6 * S, type: 'solid', visible: true, id: 'rhythmBarrier' });
      }

      // ③二曲目: たまよけ
      addSign(23 * S, GY, 'つぎは たまよけ');
      if (!trap6.done2) {
        platforms.push({ x: 30 * S, y: GY - 6 * S, w: S, h: 6 * S, type: 'solid', visible: true, id: 'rhythmBarrier2' });
      }

      // ④フィナーレ
      addSign(38 * S, GY, 'ありがとう');
      goalObj = { x: 44 * S, y: GY - 4 * S, w: S, h: 4 * S, poleKillH: 3 * S, flagY: GY - 4 * S, flagH: S };
      worldWidth = 48 * S;
    }

    function updateTraps6() {
      const S = TILE;
      if (!rhythmActive && player.onGround) {
        if (!trap6.done && player.x > 13.5 * S) startRhythm('copy');
        else if (trap6.done && !trap6.done2 && player.x > 27.5 * S) startRhythm('dodge');
      }
      checkGoal();
    }

    // ---- リズムエンジン ----------------------------------------
    // 時刻の基準は requestAnimationFrame ではなく AudioContext の時計。
    // 音は osc.start(絶対時刻) で先に予約するので、描画が落ちてもズレない。
    const RH_BPM = 120;
    const RH_BEAT = 60 / RH_BPM;      // 1拍 = 0.5秒
    const RH_JUST = 0.06;             // ジャスト判定 ±60ms
    const RH_OK = 0.13;               // おしい判定 ±130ms
    const RH_PPS = 220;               // ノーツが流れる速さ (px/秒)
    const RH_MAX_MISS = 6;

    // 前半: お手本(call)を聴いて、同じリズムを まねる(resp)。動作は▲だけ
    const RH_PHRASES = [
      { call: [4, 5, 6], resp: [8, 9, 10] },
      { call: [12, 13, 14.5], resp: [16, 17, 18.5] },
      { call: [20, 20.5, 21, 22], resp: [24, 24.5, 25, 26] },
      { call: [28, 29, 30, 30.5, 31], resp: [32, 33, 34, 34.5, 35] },
    ];
    const RH_END_BEAT = 38;

    // 後半「よけろ」: 玉が とんでくる。低い玉は▲でとび、高い玉は◀▶でしゃがむ
    // j=ジャンプ / d=しゃがむ
    const RH2_PHRASES = [
      { call: [[4, 'j'], [6, 'j']], resp: [[8, 'j'], [10, 'j']] },
      { call: [[12, 'd'], [14, 'd']], resp: [[16, 'd'], [18, 'd']] },
      { call: [[20, 'j'], [22, 'd'], [23, 'j']], resp: [[24, 'j'], [26, 'd'], [27, 'j']] },
      { call: [[28, 'd'], [29, 'j'], [30.5, 'd'], [31, 'j']], resp: [[32, 'd'], [33, 'j'], [34.5, 'd'], [35, 'j']] },
    ];
    const RH2_END_BEAT = 38;
    const RH2_FLIGHT = 2 * RH_BEAT;   // 玉が飛んでくるのにかかる時間 (2拍)

    // mode: 'copy' = まねる / 'dodge' = よける
    function startRhythm(mode) {
      initAudio();
      if (!actx) return;                       // 音が出せない環境では発動しない
      if (actx.state === 'suspended') actx.resume().catch(() => { });
      const bgm = document.getElementById('bgm');
      bgm.pause();                             // リズム中はBGMを止める

      const dodge = mode === 'dodge';
      const phrases = dodge ? RH2_PHRASES : RH_PHRASES;
      const endBeat = dodge ? RH2_END_BEAT : RH_END_BEAT;

      const cues = [];
      for (const ph of phrases) {
        for (const c of ph.call) {
          const b = dodge ? c[0] : c;
          cues.push({ beat: b, t: b * RH_BEAT, kind: 'call', act: dodge ? (c[1] === 'd' ? 'duck' : 'jump') : 'jump', judged: false, result: '' });
        }
        for (const c of ph.resp) {
          const b = dodge ? c[0] : c;
          cues.push({ beat: b, t: b * RH_BEAT, kind: 'resp', act: dodge ? (c[1] === 'd' ? 'duck' : 'jump') : 'jump', judged: false, result: '' });
        }
      }
      cues.sort((a, b) => a.t - b.t);

      // 予約する音のリスト (メトロノーム + 玉/お手本の音)
      const ev = [];
      for (let b = 0; b <= endBeat; b++) {
        ev.push({ t: b * RH_BEAT, freq: b % 4 === 0 ? 440 : 330, type: 'square', dur: 0.05, vol: b % 4 === 0 ? 0.05 : 0.03 });
      }
      for (const c of cues) {
        if (dodge) {
          // 玉が発射される瞬間に種類の音が鳴る。2拍あとに到達する
          //   低い音 (ひくい玉) → ▲でとぶ / 高い音 (たかい玉) → ◀▶でしゃがむ
          const f = c.act === 'jump' ? 300 : 1100;
          const ty = c.act === 'jump' ? 'sawtooth' : 'sine';
          ev.push({ t: c.t - RH2_FLIGHT, freq: f, type: ty, dur: 0.18, vol: 0.11 });
          if (c.kind === 'call') ev.push({ t: c.t, freq: c.act === 'jump' ? 620 : 880, type: 'triangle', dur: 0.12, vol: 0.09 });
        } else if (c.kind === 'call') {
          ev.push({ t: c.t, freq: 880, type: 'triangle', dur: 0.16, vol: 0.12 });
        }
      }
      ev.sort((a, b) => a.t - b.t);

      rhythmPresses = [];
      rhythmActive = true;
      rhythm = {
        mode: dodge ? 'dodge' : 'copy',
        endBeat,
        startTime: actx.currentTime + 1.2,     // カウントインまでの間
        lat: actx.outputLatency || actx.baseLatency || 0,
        cues, ev, evIdx: 0,
        just: 0, ok: 0, miss: 0, combo: 0, maxCombo: 0,
        flash: '', flashT: 0, catBounce: 0, gameBounce: 0,
        catAct: '', catActT: 0, gameAct: '', gameActT: 0,
        over: false, overT: 0,
        wallStart: performance.now()           // 音の時計が止まったままかを見る用
      };
    }

    // 「いま耳に届いている音」の時刻。出力遅延を引いて、聴こえた瞬間を基準にする
    function rhythmNow() {
      return actx.currentTime - rhythm.lat - rhythm.startTime;
    }

    function rhythmJudge(pressAt, act) {
      const r = rhythm;
      const t = pressAt - r.lat - r.startTime;
      let best = null, bestD = Infinity;
      for (const c of r.cues) {
        if (c.kind !== 'resp' || c.judged) continue;
        const d = Math.abs(t - c.t);
        if (d < bestD) { bestD = d; best = c; }
      }
      r.catBounce = 1; r.catAct = act; r.catActT = 1;
      if (!best || bestD > RH_OK) {          // 空打ち
        r.miss++; r.combo = 0;
        r.flash = 'ミス'; r.flashT = 1;
        playTone(200, 'sawtooth', 0.12, 0.08);
        return;
      }
      // よけるゲームでは「よけかた」が違うと当たる
      if (best.act !== act) {
        best.judged = true; best.result = 'miss';
        r.miss++; r.combo = 0;
        r.flash = act === 'jump' ? 'しゃがめ！' : 'とべ！'; r.flashT = 1;
        playTone(160, 'sawtooth', 0.18, 0.09);
        return;
      }
      best.judged = true;
      if (bestD <= RH_JUST) {
        best.result = 'just'; r.just++; r.combo++;
        r.maxCombo = Math.max(r.maxCombo, r.combo);
        r.flash = 'ジャスト！'; r.flashT = 1;
        playTone(1320, 'square', 0.12, 0.09);
      } else {
        best.result = 'ok'; r.ok++; r.combo = 0;
        r.flash = 'おしい'; r.flashT = 1;
        playTone(660, 'square', 0.12, 0.07);
      }
    }

    function updateRhythm() {
      const r = rhythm;

      // 音が鳴らせない環境 (自動再生ブロック等) で詰まないようにする。
      // 音の時計が止まったままなら、リズムは中止して先へ通す。
      if (actx.state !== 'running') {
        if (actx.state === 'suspended') actx.resume().catch(() => { });
        if (performance.now() - r.wallStart > 6000) {
          const dodge = r.mode === 'dodge';
          rhythmActive = false; rhythm = null; rhythmPresses = [];
      mgActive = false; mg = null;
          if (dodge) { trap6.done2 = true; platforms = platforms.filter(p => p.id !== 'rhythmBarrier2'); }
          else { trap6.done = true; platforms = platforms.filter(p => p.id !== 'rhythmBarrier'); }
          restartBgm();
        }
        return;
      }

      const now = rhythmNow();

      // 音の先読み予約 (0.3秒先まで)
      const ahead = actx.currentTime + 0.3;
      while (r.evIdx < r.ev.length && r.startTime + r.ev[r.evIdx].t < ahead) {
        const e = r.ev[r.evIdx++];
        const when = r.startTime + e.t;
        // 大きく過ぎた音は鳴らさない (裏に回っていた間の取りこぼしをまとめて鳴らさない)
        if (when < actx.currentTime - 0.05) continue;
        playToneAt(e.freq, e.type, e.dur, e.vol, when);
      }

      // 押した瞬間を判定 (フレームではなく音の時計で)
      while (rhythmPresses.length) {
        const p = rhythmPresses.shift();
        if (!r.over && now > -0.5) rhythmJudge(p.t, p.act);
      }

      // 押されなかったノーツを見逃しにする
      for (const c of r.cues) {
        if (c.kind === 'resp' && !c.judged && now > c.t + RH_OK) {
          c.judged = true; c.result = 'miss';
          r.miss++; r.combo = 0;
          r.flash = 'ミス'; r.flashT = 1;
        }
        if (c.kind === 'call' && !c.judged && now >= c.t) {
          c.judged = true; r.gameBounce = 1;
          r.gameAct = c.act; r.gameActT = 1;    // お手本が よけて みせる
        }
      }

      if (r.flashT > 0) r.flashT -= 0.04;
      if (r.catBounce > 0) r.catBounce -= 0.08;
      if (r.gameBounce > 0) r.gameBounce -= 0.08;
      if (r.catActT > 0) r.catActT -= 0.07;
      if (r.gameActT > 0) r.gameActT -= 0.07;

      // 失敗
      if (!r.over && r.miss >= RH_MAX_MISS) { rhythmFail(); return; }

      // 完走
      if (!r.over && now > r.endBeat * RH_BEAT) {
        r.over = true; r.overT = 0;
        playCoin();
      }
      if (r.over) {
        r.overT++;
        if (r.overT > 150) {
          lastRhythmStats = { mode: r.mode, just: r.just, ok: r.ok, miss: r.miss, maxCombo: r.maxCombo, cleared: true };
          const done2 = r.mode === 'dodge';
          rhythmActive = false; rhythm = null;
          if (done2) {
            trap6.done2 = true;
            platforms = platforms.filter(p => p.id !== 'rhythmBarrier2');
          } else {
            trap6.done = true;
            platforms = platforms.filter(p => p.id !== 'rhythmBarrier');
          }
          restartBgm();
        }
      }
    }

    function rhythmFail() {
      lastRhythmStats = { just: rhythm.just, ok: rhythm.ok, miss: rhythm.miss, maxCombo: rhythm.maxCombo, cleared: false };
      rhythmActive = false; rhythm = null;
      rhythmPresses = [];
      restartBgm();
      killPlayer();
    }

    // ---- リズム画面の描画 ---------------------------------------
    // act: '' / 'jump' (とぶ) / 'duck' (しゃがむ)、amt: 動作の強さ 0〜1
    function drawRhythmCat(cx, cy, s, bounce, act, amt) {
      const lift = act === 'jump' ? 34 * s * Math.max(0, amt) : 0;
      const squash = act === 'duck' ? Math.max(0, amt) : 0;
      const k = 1 - squash * 0.55;                  // しゃがむと縦につぶれる
      const y = cy - bounce * 10 - lift;
      const footY = y + 14 * s;            // 足元。ここを軸に縮めて 地面から浮かせない
      ctx.save();
      ctx.translate(cx, footY);
      ctx.scale(1, k);
      ctx.translate(-cx, -footY);
      ctx.fillStyle = '#111';
      ctx.fillRect(cx - 10 * s, y - 2 * s, 20 * s, 16 * s);        // からだ
      ctx.fillRect(cx - 8 * s, y - 16 * s, 16 * s, 15 * s);        // あたま
      ctx.fillRect(cx - 8 * s, y - 21 * s, 5 * s, 6 * s);          // みみ
      ctx.fillRect(cx + 3 * s, y - 21 * s, 5 * s, 6 * s);
      ctx.fillStyle = '#fff';
      ctx.fillRect(cx - 5 * s, y - 11 * s, 4 * s, 4 * s);
      ctx.fillRect(cx + 1 * s, y - 11 * s, 4 * s, 4 * s);
      ctx.fillStyle = '#111';
      ctx.fillRect(cx - 4 * s, y - 10 * s, 2 * s, 3 * s);
      ctx.fillRect(cx + 2 * s, y - 10 * s, 2 * s, 3 * s);
      ctx.restore();
    }

    // 「よけろ」の画面
    function drawRhythmDodge(now, W, H, s) {
      const r = rhythm;
      const ds = s * 1.7;                          // このゲームだけ大きめに描く
      const hitX = Math.max(96, W * 0.27);         // 玉が とどく位置
      const groundY = H * 0.62;
      const lowY = groundY - 15 * ds;              // ひくい玉 (とんでよける)
      const highY = groundY - 40 * ds;             // たかい玉 (しゃがんでよける)

      // あそびかた (プレイ領域と重ならない高さに置く)
      ctx.textAlign = 'left';
      ctx.font = 'bold ' + Math.round(13 * s) + 'px "Courier New", monospace';
      ctx.fillStyle = '#888';
      ctx.fillText('たかい玉 → 左右ボタンで しゃがむ', 14, H * 0.36);
      ctx.fillText('ひくい玉 → ▲ でとぶ', 14, H * 0.36 + 20 * s);

      // 地面
      ctx.strokeStyle = '#ccc'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();
      // 到達ライン
      ctx.strokeStyle = '#111'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(hitX, highY - 20 * ds); ctx.lineTo(hitX, groundY); ctx.stroke();

      // 玉 (2拍かけて右から飛んでくる)
      for (const c of r.cues) {
        const dt = c.t - now;
        if (dt > RH2_FLIGHT || dt < -0.45) continue;
        const prog = 1 - dt / RH2_FLIGHT;                 // 0 → 1
        const x = W + 34 - prog * (W + 34 - hitX);
        const y = c.act === 'jump' ? lowY : highY;
        const rad = 14 * ds;
        ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2);
        if (c.kind === 'call') { ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = '#111'; ctx.lineWidth = 3; ctx.stroke(); }
        else { ctx.fillStyle = c.judged && c.result !== 'miss' ? '#ccc' : '#111'; ctx.fill(); }
        // ひくい玉は下に線、たかい玉は上に線。音が聞こえなくても見分けられる
        ctx.strokeStyle = '#111'; ctx.lineWidth = 3;
        ctx.beginPath();
        if (c.act === 'jump') { ctx.moveTo(x - rad, y + rad + 6); ctx.lineTo(x + rad, y + rad + 6); }
        else { ctx.moveTo(x - rad, y - rad - 6); ctx.lineTo(x + rad, y - rad - 6); }
        ctx.stroke();
      }

      // お手本 (うしろ) と きみ (まえ)。どちらも地面に立たせる
      const gs = s * 0.95, gx = hitX - 74 * s;
      drawRhythmGameChar(gx, groundY - 3 * gs, gs, r.gameBounce);
      if (r.gameActT > 0) {
        ctx.fillStyle = '#666';
        ctx.font = 'bold ' + Math.round(13 * s) + 'px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText(r.gameAct === 'jump' ? 'とぶ！' : 'しゃがむ！', gx, groundY - 30 * gs);
      }
      drawRhythmCat(hitX, groundY - 14 * ds, ds, r.catBounce, r.catAct, r.catActT);

      // 名前は地面の下に置いて キャラと重ならないようにする
      ctx.textAlign = 'center';
      ctx.fillStyle = '#aaa';
      ctx.font = 'bold ' + Math.round(12 * s) + 'px "Courier New", monospace';
      ctx.fillText('おてほん', gx, groundY + 24 * s);
      ctx.fillText('きみ', hitX, groundY + 24 * s);
      ctx.textAlign = 'left';
    }

    function drawRhythmGameChar(cx, cy, s, bounce) {
      const y = cy - bounce * 10;
      ctx.fillStyle = '#111';
      ctx.fillRect(cx - 12 * s, y - 14 * s, 24 * s, 12 * s);
      ctx.fillRect(cx - 16 * s, y - 10 * s, 4 * s, 8 * s);
      ctx.fillRect(cx + 12 * s, y - 10 * s, 4 * s, 8 * s);
      ctx.fillRect(cx - 8 * s, y - 2 * s, 5 * s, 5 * s);
      ctx.fillRect(cx + 3 * s, y - 2 * s, 5 * s, 5 * s);
      ctx.fillStyle = '#fff';
      ctx.fillRect(cx - 7 * s, y - 11 * s, 4 * s, 4 * s);
      ctx.fillRect(cx + 3 * s, y - 11 * s, 4 * s, 4 * s);
    }

    function drawRhythm() {
      const W = canvas.width, H = canvas.height, r = rhythm;
      const now = rhythmNow();

      // 背景: 拍のたびに ふわっと脈打つ
      const bp = ((now / RH_BEAT) % 1 + 1) % 1;
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(17,17,17,' + (Math.max(0, 1 - bp * 2) * 0.07).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);

      const targetX = Math.max(78, W * 0.24);
      const callY = H * 0.42, respY = H * 0.62;
      const s = Math.min(1.6, W / 420);

      if (r.mode === 'dodge') { drawRhythmDodge(now, W, H, s); drawRhythmHud(r, now, W, H, s, targetX, respY); return; }

      // 2本のレーン
      ctx.strokeStyle = '#ddd'; ctx.lineWidth = 2;
      for (const ly of [callY, respY]) {
        ctx.beginPath(); ctx.moveTo(0, ly); ctx.lineTo(W, ly); ctx.stroke();
      }
      // 判定ライン
      ctx.strokeStyle = '#111'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(targetX, callY - 40); ctx.lineTo(targetX, respY + 40); ctx.stroke();

      // ノーツ
      for (const c of r.cues) {
        const x = targetX + (c.t - now) * RH_PPS;
        if (x < -40 || x > W + 40) continue;
        const y = c.kind === 'call' ? callY : respY;
        ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI * 2);
        if (c.kind === 'call') {                 // お手本: 白丸 (聴くだけ)
          ctx.fillStyle = '#fff'; ctx.fill();
          ctx.strokeStyle = '#111'; ctx.lineWidth = 3; ctx.stroke();
        } else if (!c.judged) {                  // これから押す: 黒丸
          ctx.fillStyle = '#111'; ctx.fill();
        } else {                                 // 判定ずみ
          ctx.fillStyle = c.result === 'just' ? '#111' : (c.result === 'ok' ? '#888' : '#e0e0e0');
          ctx.fill();
        }
      }

      // キャラクター
      drawRhythmGameChar(targetX - 46, callY + 18, s * 0.9, r.gameBounce);
      drawRhythmCat(targetX - 46, respY + 26, s * 0.9, r.catBounce, '', 0);

      ctx.textAlign = 'left';
      ctx.fillStyle = '#888';
      ctx.font = 'bold ' + Math.round(13 * s) + 'px "Courier New", monospace';
      ctx.fillText('おてほん', 14, callY - 46);
      ctx.fillText('きみ', 14, respY - 46);

      drawRhythmHud(r, now, W, H, s, targetX, respY);
    }

    // 見出し・判定・スコア (2曲で共通)
    function drawRhythmHud(r, now, W, H, s, targetX, flashY) {
      const dodge = r.mode === 'dodge';

      // 判定表示
      if (r.flashT > 0) {
        ctx.globalAlpha = Math.max(0, Math.min(1, r.flashT));
        ctx.fillStyle = r.flash === 'ジャスト！' ? '#111' : (r.flash === 'おしい' ? '#777' : '#c0392b');
        ctx.font = 'bold ' + Math.round(26 * s) + 'px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText(r.flash, targetX, flashY + 78);
        ctx.globalAlpha = 1;
      }

      // 見出し
      ctx.textAlign = 'center';
      ctx.fillStyle = '#111';
      if (r.over) {
        ctx.font = 'bold ' + Math.round(24 * s) + 'px "Courier New", monospace';
        ctx.fillText(dodge ? 'アンコール、かんそう！' : 'いっきょくめ、せいこう！', W / 2, H * 0.2);
        ctx.font = 'bold ' + Math.round(15 * s) + 'px "Courier New", monospace';
        ctx.fillText('さいだいコンボ ' + r.maxCombo, W / 2, H * 0.2 + 28 * s);
      } else if (now < 4 * RH_BEAT) {
        ctx.font = 'bold ' + Math.round(19 * s) + 'px "Courier New", monospace';
        ctx.fillText(dodge ? '玉を よけろ' : 'おてほんの リズムを まねろ', W / 2, H * 0.2);
        ctx.font = Math.round(13 * s) + 'px "Courier New", monospace';
        ctx.fillStyle = '#666';
        ctx.fillText(dodge ? 'おてほんを みて まねろ' : '▲を たてラインで おす', W / 2, H * 0.2 + 26 * s);
      }

      // スコア
      ctx.textAlign = 'right';
      ctx.fillStyle = '#333';
      ctx.font = 'bold ' + Math.round(14 * s) + 'px "Courier New", monospace';
      ctx.fillText('ジャスト ' + r.just + '   ミス ' + r.miss + ' / ' + RH_MAX_MISS, W - 14, H * 0.29);
      if (r.combo >= 3) ctx.fillText(r.combo + ' コンボ！', W - 14, H * 0.29 + 22 * s);
      ctx.textAlign = 'left';
    }

    // ============================================================
    // ステージ7 「ひだりは みぎ、みぎは ひだり」
    //   反転ボタン → 水の溝 → 扉の中のミサイル2種 → 逃げるゴール
    // ============================================================
    function buildStage7() {
      platforms = []; hazards = []; movingObjects = []; projectiles = []; pitSpikes = [];
      enemies = []; decorations = []; zones = []; trueGoal = null; glitchActive = false; invert = false;
      // ミニゲームのクリアだけは持ち越す (反転は死んだらやりなおし)
      const g1 = trap7 && trap7.game1 ? true : false;
      const g2 = trap7 && trap7.game2 ? true : false;
      trap7 = { game1: g1, game2: g2, inverted: false, goalRun: false };
      const S = TILE;

      // ①スタート: ？ブロックが2つ
      for (let i = 0; i <= 12; i++)addSolid(i * S, GY);
      addQBlock(4 * S, GY - 4 * S, 'button');    // ボタンが とび出す
      addQBlock(8 * S, GY - 4 * S, 'death');     // たたいた だけで しぬ
      addSign(1 * S, GY, 'たたくな');

      // ②水の溝 (13〜21) を たてブロック2つで わたる
      hazards.push({ x: 13 * S, y: GY + 4, w: 9 * S, h: 4 * S, type: 'water', visible: true });
      addSolid(15 * S, GY - 2 * S, S, 5 * S);
      addSolid(18 * S, GY - 3 * S, S, 6 * S);

      // ③扉ゾーン: 扉に入って ミサイルに勝つと 壁が消える
      for (let i = 22; i <= 44; i++)addSolid(i * S, GY);
      decorations.push({ type: 'door', id: 'door1', x: 25 * S, y: GY - 3 * S, open: g1 });
      if (!g1) platforms.push({ x: 29 * S, y: GY - 6 * S, w: S, h: 6 * S, type: 'solid', visible: true, id: 'wall7A' });
      decorations.push({ type: 'door', id: 'door2', x: 33 * S, y: GY - 3 * S, open: g2 });
      if (!g2) platforms.push({ x: 37 * S, y: GY - 6 * S, w: S, h: 6 * S, type: 'solid', visible: true, id: 'wall7B' });

      // ④旗は にげる。穴をこえた先で やっと止まる
      hazards.push({ x: 45 * S, y: GY + 4, w: 3 * S, h: 4 * S, type: 'water', visible: true });
      for (let i = 48; i <= 60; i++)addSolid(i * S, GY);
      addSign(50 * S, GY, 'にげるな');
      goalObj = { x: 41 * S, y: GY - 4 * S, w: S, h: 4 * S, poleKillH: 3 * S, flagY: GY - 4 * S, flagH: S, running: false };
      worldWidth = 62 * S;
    }

    function updateTraps7() {
      const S = TILE, px = player.x;

      // 扉に入る
      if (!mgActive && player.onGround) {
        if (!trap7.game1 && Math.abs(px - 25 * S) < 0.9 * S) startMiniGame('dodge');
        else if (trap7.game1 && !trap7.game2 && Math.abs(px - 33 * S) < 0.9 * S) startMiniGame('shoot');
      }

      // にげるゴール (穴の むこうで 止まる)
      if (!trap7.goalRun && px > 39 * S) { goalObj.running = true; trap7.goalRun = true; playError(); }
      if (goalObj && goalObj.running) {
        goalObj.x += 3.9;
        if (goalObj.x >= 54 * S) { goalObj.x = 54 * S; goalObj.running = false; }
      }

      checkGoal();
    }

    // ---- 扉のなかのミサイル ------------------------------------
    // kind: 'dodge' = 上から降ってくるのを よける / 'shoot' = 見下ろしで うちおとす
    function startMiniGame(kind) {
      initAudio();
      document.getElementById('bgm').pause();
      mgActive = true;
      mg = {
        kind, t: 0, hit: 0, spawned: 0, total: 10,
        missiles: [], booms: [], bullets: [],
        px: canvas.width / 2, aim: 0,
        nextSpawn: 70, over: false, overT: 0,
        msg: kind === 'dodge' ? '＊ ミサイルが ふってくる！' : '＊ うちおとせ！'
      };
      playTone(180, 'sawtooth', 0.3, 0.1);
    }

    function miniGameFail() {
      mgActive = false; mg = null;
      restartBgm();
      killPlayer();
    }

    function miniGameClear() {
      const kind = mg.kind;
      mgActive = false; mg = null;
      if (kind === 'dodge') {
        trap7.game1 = true;
        platforms = platforms.filter(p => p.id !== 'wall7A');
        const d = decorations.find(x => x.id === 'door1'); if (d) d.open = true;
      } else {
        trap7.game2 = true;
        platforms = platforms.filter(p => p.id !== 'wall7B');
        const d = decorations.find(x => x.id === 'door2'); if (d) d.open = true;
      }
      // 扉の右へ 押し出す
      player.x += 1.6 * TILE; snapCamera();
      restartBgm();
    }

    function updateMiniGame() {
      const m = mg, W = canvas.width, H = canvas.height;
      m.t++;
      const floorY = H * 0.78;

      if (m.kind === 'dodge') {
        // ---- よける ----
        const spd = 4.2;
        if (keys.left) m.px -= spd;
        if (keys.right) m.px += spd;
        m.px = Math.max(26, Math.min(W - 26, m.px));

        if (!m.over && m.spawned < m.total && m.t >= m.nextSpawn) {
          const i = m.spawned++;
          const mis = { x: 40 + Math.random() * (W - 80), y: -30, vx: 0, vy: 4.4, wob: 0, kind: 'straight' };
          if (i >= 5) {
            // 5個目からは まっすぐ 落ちてこない
            const p = i % 3;
            if (p === 0) { mis.vx = (Math.random() < 0.5 ? -1 : 1) * 2.6; mis.kind = 'diag'; }
            else if (p === 1) { mis.kind = 'wob'; mis.vy = 3.9; }
            else { mis.vy = 6.2; mis.kind = 'fast'; }
          }
          m.missiles.push(mis);
          m.nextSpawn = m.t + (i < 5 ? 66 : 52);
          playTone(700 - i * 20, 'square', 0.08, 0.05);
        }

        for (const mi of m.missiles) {
          if (mi.done) continue;
          if (mi.kind === 'wob') { mi.wob += 0.09; mi.vx = Math.sin(mi.wob) * 3.4; }
          mi.x += mi.vx; mi.y += mi.vy;
          if (mi.x < 16 || mi.x > W - 16) mi.vx *= -1;
          // 直撃
          if (rectOverlap(m.px - 13, floorY - 30, 26, 30, mi.x - 7, mi.y - 14, 14, 28)) { miniGameFail(); return; }
          if (mi.y >= floorY) {
            mi.done = true;
            m.booms.push({ x: mi.x, y: floorY, r: 8, t: 0 });
            shakeTimer = 6;
            playTone(120, 'sawtooth', 0.28, 0.12);
          }
        }

        for (const b of m.booms) {
          b.t++;
          if (b.t <= 16) b.r += 4.4;                    // ひろがる爆風
          // ひろがりきるまでが 当たり判定
          if (b.t <= 22 && Math.abs(m.px - b.x) < b.r + 8) { miniGameFail(); return; }
        }
        m.booms = m.booms.filter(b => b.t < 40);

        const allDone = m.spawned >= m.total && m.missiles.every(x => x.done) && m.booms.every(b => b.t > 22);
        if (!m.over && allDone) { m.over = true; m.overT = 0; playCoin(); }

      } else {
        // ---- うちおとす (見下ろし) ----
        const cx = W / 2, cy = H * 0.74;
        if (keys.left) m.aim -= 0.045;
        if (keys.right) m.aim += 0.045;
        m.aim = Math.max(-1.15, Math.min(1.15, m.aim));

        if (jumpPressed && !m.over) {
          const a = m.aim - Math.PI / 2;               // 上むきが 0度
          m.bullets.push({ x: cx + Math.cos(a) * 26, y: cy + Math.sin(a) * 26, vx: Math.cos(a) * 10, vy: Math.sin(a) * 10 });
          playTone(980, 'square', 0.06, 0.05);
        }
        jumpPressed = false;

        if (!m.over && m.spawned < m.total && m.t >= m.nextSpawn) {
          const i = m.spawned++;
          const sx = 50 + Math.random() * (W - 100);
          const tvx = (cx - sx) / 150;
          m.missiles.push({ x: sx, y: -24, vx: tvx * (0.4 + Math.random() * 0.8), vy: 2.5 + i * 0.16 });
          m.nextSpawn = m.t + 62;
          playTone(300, 'sawtooth', 0.12, 0.06);
        }

        for (const mi of m.missiles) {
          if (mi.done) continue;
          mi.x += mi.vx; mi.y += mi.vy;
          if (mi.y > cy - 18) { miniGameFail(); return; }     // ネコに とどいた
        }
        for (const b of m.bullets) {
          b.x += b.vx; b.y += b.vy;
          for (const mi of m.missiles) {
            if (mi.done) continue;
            if (Math.hypot(b.x - mi.x, b.y - mi.y) < 20) {
              mi.done = true; b.done = true; m.hit++;
              m.booms.push({ x: mi.x, y: mi.y, r: 6, t: 0 });
              playTone(220, 'square', 0.12, 0.08);
              break;
            }
          }
        }
        m.bullets = m.bullets.filter(b => !b.done && b.y > -40 && b.y < H + 40 && b.x > -40 && b.x < W + 40);
        for (const b of m.booms) { b.t++; if (b.t <= 10) b.r += 3.2; }
        m.booms = m.booms.filter(b => b.t < 26);

        if (!m.over && m.hit >= m.total) { m.over = true; m.overT = 0; playCoin(); }
      }

      if (m.over) { m.overT++; if (m.overT > 110) miniGameClear(); }
    }

    function drawMiniGame() {
      const m = mg, W = canvas.width, H = canvas.height;
      const s = Math.min(1.6, W / 420);
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);

      ctx.save();
      if (shakeTimer > 0) { shakeTimer--; ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 6); }

      if (m.kind === 'dodge') {
        const floorY = H * 0.78;
        ctx.strokeStyle = '#bbb'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(0, floorY); ctx.lineTo(W, floorY); ctx.stroke();

        for (const b of m.booms) {                    // 爆風
          const a = b.t <= 22 ? 1 : Math.max(0, 1 - (b.t - 22) / 18);
          ctx.globalAlpha = a;
          ctx.strokeStyle = b.t <= 22 ? '#c0392b' : '#999'; ctx.lineWidth = 4;
          ctx.beginPath(); ctx.arc(b.x, b.y, b.r, Math.PI, 0); ctx.stroke();
          ctx.globalAlpha = 1;
        }
        for (const mi of m.missiles) {                // ミサイル
          if (mi.done) continue;
          drawMissile(mi.x, mi.y, s, Math.atan2(mi.vy, mi.vx) + Math.PI / 2);
        }
        drawRhythmCat(m.px, floorY - 14 * s * 1.4, s * 1.4, 0, '', 0);

      } else {
        const cx = W / 2, cy = H * 0.74;
        // 見下ろしの地面
        ctx.strokeStyle = '#eee'; ctx.lineWidth = 2;
        for (let y = H * 0.2; y < H * 0.86; y += 46) { ctx.beginPath(); ctx.moveTo(20, y); ctx.lineTo(W - 20, y); ctx.stroke(); }
        ctx.strokeStyle = '#ddd'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(cx, cy, 34 * s, 0, Math.PI * 2); ctx.stroke();

        for (const b of m.booms) {
          ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 3;
          ctx.globalAlpha = Math.max(0, 1 - b.t / 26);
          ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
          ctx.globalAlpha = 1;
        }
        for (const mi of m.missiles) {
          if (mi.done) continue;
          drawMissile(mi.x, mi.y, s, Math.atan2(mi.vy, mi.vx) + Math.PI / 2);
        }
        ctx.fillStyle = '#111';
        for (const b of m.bullets) { ctx.beginPath(); ctx.arc(b.x, b.y, 4.5 * s, 0, Math.PI * 2); ctx.fill(); }

        drawTopDownCat(cx, cy, s, m.aim);
      }
      ctx.restore();

      // 進行ぐあい
      ctx.textAlign = 'center';
      ctx.fillStyle = '#111';
      ctx.font = 'bold ' + Math.round(20 * s) + 'px "Courier New", monospace';
      if (m.over) ctx.fillText(m.kind === 'dodge' ? 'よけきった！' : 'ぜんぶ おとした！', W / 2, H * 0.2);
      else if (m.t < 120) ctx.fillText(m.msg, W / 2, H * 0.2);

      ctx.font = Math.round(13 * s) + 'px "Courier New", monospace';
      ctx.fillStyle = '#666';
      if (!m.over && m.t < 120) {
        ctx.fillText(m.kind === 'dodge' ? '左右ボタンで よける (ばくふうも あたる)' : '左右で ねらい ▲ で うつ', W / 2, H * 0.2 + 26 * s);
      }
      ctx.textAlign = 'right';
      ctx.fillStyle = '#333';
      ctx.font = 'bold ' + Math.round(15 * s) + 'px "Courier New", monospace';
      const n = m.kind === 'dodge' ? m.missiles.filter(x => x.done).length : m.hit;
      ctx.fillText('ミサイル ' + n + ' / ' + m.total, W - 14, H * 0.28);
      ctx.textAlign = 'left';
    }

    function drawMissile(x, y, s, ang) {
      ctx.save();
      ctx.translate(x, y); ctx.rotate(ang);
      ctx.fillStyle = '#111';
      ctx.fillRect(-5 * s, -8 * s, 10 * s, 18 * s);                       // どうたい
      ctx.beginPath();                                                     // 先っぽ
      ctx.moveTo(-5 * s, -8 * s); ctx.lineTo(0, -18 * s); ctx.lineTo(5 * s, -8 * s); ctx.closePath(); ctx.fill();
      ctx.fillRect(-9 * s, 4 * s, 4 * s, 7 * s);                           // はね
      ctx.fillRect(5 * s, 4 * s, 4 * s, 7 * s);
      ctx.fillStyle = '#c0392b';                                           // ふんしゃ
      ctx.beginPath();
      ctx.moveTo(-4 * s, 10 * s); ctx.lineTo(0, (16 + Math.random() * 6) * s); ctx.lineTo(4 * s, 10 * s); ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    // 見下ろしのネコ + 銃口
    function drawTopDownCat(cx, cy, s, aim) {
      const a = aim - Math.PI / 2;
      ctx.strokeStyle = '#111'; ctx.lineWidth = 5 * s;      // 銃身
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * 34 * s, cy + Math.sin(a) * 34 * s); ctx.stroke();
      // ねらいの線
      ctx.strokeStyle = 'rgba(17,17,17,0.18)'; ctx.lineWidth = 2;
      ctx.setLineDash([6, 8]);
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * 900, cy + Math.sin(a) * 900); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#111';                                // からだ (まるく)
      ctx.beginPath(); ctx.ellipse(cx, cy, 17 * s, 20 * s, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath();                                       // みみ
      ctx.moveTo(cx - 15 * s, cy - 13 * s); ctx.lineTo(cx - 20 * s, cy - 23 * s); ctx.lineTo(cx - 7 * s, cy - 18 * s); ctx.closePath(); ctx.fill();
      ctx.moveTo(cx + 15 * s, cy - 13 * s); ctx.lineTo(cx + 20 * s, cy - 23 * s); ctx.lineTo(cx + 7 * s, cy - 18 * s); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(cx - 6 * s, cy - 4 * s, 3 * s, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + 6 * s, cy - 4 * s, 3 * s, 0, Math.PI * 2); ctx.fill();
    }

    // 偽エンディング後の世界改変
    function applyFinalPhase() {
      goalObj = null;                    // 偽の旗は消える
      const S = TILE;
      trueGoal = { x: 106 * S, y: GY - 4 * S, w: S, h: 4 * S, poleKillH: 3 * S, flagY: GY - 4 * S, flagH: S };
      invert = true; glitchActive = true;
      document.body.classList.add('finalZone');
    }

    function snapCamera() {
      camera.x = Math.max(0, Math.min(player.x - canvas.width * 0.35, worldWidth - canvas.width));
    }

    // ============================================================
    // トラップ更新 (3面)
    // ============================================================
    function updateTraps3() {
      revealInvisibleBlocks();     // ゴール前の「みえないブロック」
      checkFakeGoal(); checkGoal();
    }

    // ============================================================
    // トラップ更新 (4面)
    // ============================================================
    function updateTraps4() {
      const S = TILE, px = player.x;

      // 戦闘のとびら
      if (!trap4.battleDone && !battleActive && px > 27.5 * S && player.onGround) {
        startBattle();
      }

      // 大砲 (最終地帯)
      if (trap4.battleDone && px > 33 * S && px < 52 * S) {
        trap4.canonTimer++;
        if (trap4.canonTimer > 40) {
          trap4.canonTimer = 0;
          const seq = ['down', 'up', 'down', 'down', 'up'];
          const current = seq[trap4.canonIndex % seq.length];
          trap4.canonIndex++;
          let yPos = current === 'up' ? GY - 2.5 * S - 10 : GY - S - 10;
          projectiles.push({ x: 53.5 * S, y: yPos, w: 16, h: 16, vx: -6.5, vy: 0, type: 'cannonball' });
          playShoot();
        }
      }

      checkFakeGoal(); checkGoal();
    }

    // ============================================================
    // トラップ更新 (5面)
    // ============================================================
    function updateTraps5() {
      const S = TILE, px = player.x;

      if (!stage5Final) {
        // パックマン式・画面端ワープ (左端 → 壁のむこう側)
        if (px < 0.8 * S && !trap5.warped) {
          trap5.warped = true;
          player.x = 29.5 * S; player.vx = 0;
          snapCamera(); playWarp(); shakeTimer = 8;
          setTimeout(() => { trap5.warped = false; }, 500);
        }

        // フリーズ事件 (偽の「応答なし」ダイアログ)
        if (!trap5.freezeDone && px > 56 * S && player.onGround) {
          trap5.freezeDone = true;
          freezeTimer = 140;
          playError();
        }

        // グリッチ地帯
        glitchActive = px > 64 * S && px < 77 * S;
      } else {
        glitchActive = true;

        // 迫りくる壁 (ほんとうのさいご)
        if (!trap5.wallActive && px > 84 * S) {
          trap5.wallActive = true;
          for (const h of hazards) {
            if (h.type === 'chase_wall') { h.active = true; h.visible = true; h.x = camera.x - 2 * S; }
          }
        }

        // 天井トゲ
        if (!trap5.ceilA && px > 99.5 * S) {
          trap5.ceilA = true;
          for (const m of movingObjects) { if (m.id === 'final1') { m.active = true; m.visible = true; m.y = -S; m.vy = 15; } }
        }
        if (!trap5.ceilB && px > 102.5 * S) {
          trap5.ceilB = true;
          for (const m of movingObjects) { if (m.id === 'final2') { m.active = true; m.visible = true; m.y = -S; m.vy = 15; } }
        }

        // ほんもののゴール
        if (trueGoal) {
          const g = trueGoal;
          if (rectOverlap(player.x, player.y, CAT_W, CAT_H, g.x, g.flagY, g.w + 22, g.flagH)) {
            triggerEncore();
          }
          if (player.alive && rectOverlap(player.x, player.y, CAT_W, CAT_H, g.x + S / 2 - 3, g.flagY + g.flagH, 6, g.poleKillH)) {
            killPlayer();   // 最後の最後までポールは敵
          }
        }
      }

      checkFakeGoal(); checkGoal();
    }

    // ============================================================
    // ？ブロック (叩いた者の責任)
    // ============================================================
    function bonkQBlock(b) {
      if (b.used) { playHit(); return; }
      b.used = true; b.bounce = 8;
      const S = TILE;
      if (b.content === 'coin') {
        decorations.push({ type: 'coin', x: b.x + 8, y: b.y - S, timer: 40 });
        playCoin();
      } else if (b.content === 'mushroom') {
        enemies.push({ type: 'mush', x: b.x + 3, y: b.y - S + 4, w: 26, h: 26, vx: player.x < b.x ? -2.4 : 2.4, vy: 0 });
        playTone(320, 'square', 0.2, 0.08);
      } else if (b.content === 'cointrap') {
        decorations.push({ type: 'coin', x: b.x + 8, y: b.y - S, timer: 30, evil: true });
        playCoin();
      } else if (b.content === 'button') {
        // ボタンが とび出す。落ちてくる間に あたると しぬ
        movingObjects.push({
          type: 'button', x: b.x + 3, y: b.y - S, w: S - 6, h: 14,
          vy: -9.5, state: 'fly', pressed: false, active: true, visible: true
        });
        playTone(520, 'square', 0.14, 0.09);
      } else if (b.content === 'death') {
        // たたいた だけで しぬ
        playError(); shakeTimer = 10;
        killPlayer();
      }
    }

    function updateEnemies() {
      for (const e of enemies) {
        if (e.type === 'mush') {
          e.x += e.vx; e.vy += GRAVITY; e.y += e.vy;
          if (e.y + e.h > GY) { e.y = GY - e.h; e.vy = 0; }
          if (player.alive && rectOverlap(player.x, player.y, CAT_W, CAT_H, e.x + 2, e.y + 2, e.w - 4, e.h - 4)) killPlayer();
        }
      }
      enemies = enemies.filter(e => e.x > -100 && e.x < worldWidth + 100 && e.y < canvas.height + 200);

      // コイン演出 (evilコインは落下して襲ってくる)
      for (let i = decorations.length - 1; i >= 0; i--) {
        const d = decorations[i];
        if (d.type === 'coin') {
          d.timer--; d.y -= 2;
          if (d.timer <= 0) {
            if (d.evil) { projectiles.push({ x: d.x, y: d.y, w: 16, h: 16, vy: 6, type: 'coin' }); playShoot(); }
            decorations.splice(i, 1);
          }
        }
      }
    }

    // ============================================================
    // Undertale風バトル (青いたましい / ホネ / あおいこうげき)
    // ============================================================
    function startBattle() {
      battleActive = true;
      battle = {
        t: 0,
        hx: 0, hy: 0, hvy: 0, onGround: true,
        bones: [], tears: [],
        nextBone: 0, nextTear: 0, nextBlue: 0,
        blueWarn: 0, over: false,
        msg: '＊ ゲームが あらわれた！'
      };
      document.getElementById('bgm').pause();
      playTone(220, 'square', 0.3, 0.08);
    }

    function battleBox() {
      const BW = Math.min(380, canvas.width - 32), BH = 185;
      const BX = (canvas.width - BW) / 2;
      const BY = Math.max(110, canvas.height * 0.30);
      return { BX, BY, BW, BH };
    }

    function updateBattle() {
      const b = battle; if (!b) return;
      const { BX, BY, BW, BH } = battleBox();
      const HW = 14, HH = 14;
      const floorY = BY + BH - 4 - HH;
      b.t++;

      // メッセージ進行
      if (b.t === 100) b.msg = '＊ ネコの たましいが あおくなった！';
      if (b.t === 180) b.msg = '';

      // ハート操作 (青ソウル: 重力あり・ジャンプで避けろ)
      if (b.t >= 100 && !b.over) {
        if (keys.left) b.hx -= 2.6;
        if (keys.right) b.hx += 2.6;
        b.hx = Math.max(BX + 4, Math.min(b.hx, BX + BW - 4 - HW));
        if (jumpPressed && b.onGround) { b.hvy = -7.8; b.onGround = false; }
        b.hvy += 0.5; b.hy += b.hvy;
        if (b.hy >= floorY) { b.hy = floorY; b.hvy = 0; b.onGround = true; }
        if (b.hy < BY + 4) { b.hy = BY + 4; b.hvy = 0; }
      } else {
        b.hx = BX + BW / 2 - HW / 2; b.hy = floorY;
      }
      jumpPressed = false;

      // 攻撃フェーズ
      if (b.t >= 180 && b.t < 1500 && !b.over) {
        // ホネ (白)
        if (b.t >= b.nextBone) {
          let interval, h, spd;
          if (b.t < 560) { interval = 65; h = 38; spd = 3.2; }
          else if (b.t < 1000) { interval = 60; h = 38; spd = 3.8; }
          else { interval = 75; h = 40; spd = 4.6; }
          const fromLeft = b.t >= 560 && (Math.floor(b.t / 120) % 2 === 0);
          b.bones.push({
            x: fromLeft ? BX + 2 : BX + BW - 14,
            y: BY + BH - 4 - h, w: 12, h,
            vx: fromLeft ? spd : -spd, blue: false
          });
          b.nextBone = b.t + interval;
          playTone(600, 'triangle', 0.05, 0.04);
        }
        // なみだ (上から降る)
        if (b.t >= 560 && b.t < 1000 && b.t >= b.nextTear) {
          b.tears.push({ x: BX + 20 + Math.random() * (BW - 40), y: BY + 6, w: 8, h: 10, vy: 2.8 });
          b.nextTear = b.t + 90;
        }
        // あおいホネ (うごくな！)
        if (b.t >= 1000) {
          if (b.nextBlue === 0) b.nextBlue = b.t + 60;
          if (b.t === b.nextBlue - 45) { b.blueWarn = 45; playTone(180, 'sine', 0.4, 0.1); }
          if (b.t >= b.nextBlue) {
            b.bones.push({ x: BX + BW - 14, y: BY + 4, w: 12, h: BH - 8, vx: -2.6, blue: true });
            b.nextBlue = b.t + 150;
          }
        }
      }
      if (b.blueWarn > 0) b.blueWarn--;

      // ホネ・なみだの移動と当たり
      for (const bone of b.bones) {
        bone.x += bone.vx;
        if (player.alive && rectOverlap(b.hx + 2, b.hy + 2, HW - 4, HH - 4, bone.x, bone.y, bone.w, bone.h)) {
          if (bone.blue) {
            const moving = keys.left || keys.right || !b.onGround;
            if (moving) { battleDeath(); return; }
          } else {
            battleDeath(); return;
          }
        }
      }
      b.bones = b.bones.filter(x => x.x > BX - 20 && x.x < BX + BW + 20);
      for (const t of b.tears) {
        t.y += t.vy;
        if (player.alive && rectOverlap(b.hx + 2, b.hy + 2, HW - 4, HH - 4, t.x, t.y, t.w, t.h)) { battleDeath(); return; }
      }
      b.tears = b.tears.filter(t => t.y < BY + BH - 6);

      // 生存クリア
      if (b.t === 1500) {
        b.bones = []; b.tears = [];
        b.msg = '＊ ゲームは ネコを みのがした。';
        b.over = true;
        playCoin();
      }
      if (b.over && b.t > 1620) {
        battleActive = false; battle = null;
        trap4.battleDone = true;
        platforms = platforms.filter(p => p.id !== 'battleBarrier');   // バリア解除
        restartBgm();
      }
    }

    function battleDeath() {
      diedInBattle = true;
      battleActive = false; battle = null;
      killPlayer();
    }

    function checkFakeGoal() {
      const S = TILE, px = player.x, py = player.y;
      for (const m of movingObjects) {
        if (m.type === 'fake_goal' && !m.triggered) {
          if (Math.abs(px - m.x) < S * 1.5 && py < GY && py > GY - 5 * S) {
            m.triggered = true;
            const n = currentStage === 1 ? 6 : 8;
            for (let i = 0; i < n; i++) projectiles.push({ x: m.x + (i - (n / 2)) * S * 0.7, y: -S, w: 10, h: 20, vy: 10 + i * 1.5 });
          }
        }
      }
    }

    function checkGoal() {
      if (!goalObj || state !== 'playing' || !player.alive || IS_DEAD) return;
      const g = goalObj, S = TILE;
      // 旗(最上部) → クリア
      if (rectOverlap(player.x, player.y, CAT_W, CAT_H, g.x, g.flagY, g.w + 22, g.flagH)) {
        if (currentStage === 5) { if (!stage5Final) startFakeClear(); }
        else if (currentStage < STAGE_MAX) triggerStageClear();
        else triggerAllClear(true);          // ステージ6のゴール = ほんとうのさいご
        return;
      }
      // ポール本体 → 死亡
      if (player.alive && rectOverlap(player.x, player.y, CAT_W, CAT_H, g.x + S / 2 - 3, g.flagY + g.flagH, 6, g.poleKillH)) {
        killPlayer();
      }
    }

    // ============================================================
    // 4島ギミック
    // ============================================================
    function updateIslandGimmick() {
      const S = TILE;
      const isA = platforms.find(b => b.id === 'islandA');
      const isB = platforms.find(b => b.id === 'islandB');
      const isC = platforms.find(b => b.id === 'islandC');
      const isD = platforms.find(b => b.id === 'islandD');
      if (!isA || !isB || !isC || !isD) return;
      const onIsl = (isl) => player.onGround && rectOverlap(player.x, player.y + CAT_H - 2, CAT_W, 4, isl.x, isl.y, isl.w, S / 2);
      if (!trap.islandAUp1 && onIsl(isB)) { trap.islandAUp1 = true; isB.x += S; isA.y -= 2 * S; isB.fallTimer = 60; }
      if (!trap.islandAUp2 && onIsl(isC)) { trap.islandAUp2 = true; isC.x -= S; isC.y += 2 * S; isA.y -= 2 * S; }
      if (!trap.islandAUp3 && onIsl(isD)) { trap.islandAUp3 = true; isA.y -= 2 * S; isD.landed = true; }
      if (trap.islandAUp3 && !trap.islandAFly && isD.landed && !onIsl(isD)) { trap.islandAFly = true; isA.flying = true; isA.flyVx = 14; }
      if (isB.fallTimer > 0) { isB.fallTimer--; if (isB.fallTimer === 0) isB.falling = true; }
    }

    // ============================================================
    // 物理更新
    // ============================================================
    function updateMovingObjects() {
      for (const m of movingObjects) {
        if (!m.active && m.type !== 'fake_goal') continue;
        if (m.type === 'ceiling_spike') {
          m.y += m.vy; if (m.y > canvas.height + 100) m.done = true;
          if (!m.done && player.alive && rectOverlap(player.x, player.y, CAT_W, CAT_H, m.x, m.y, m.w, m.h)) killPlayer();
        }
        if (m.type === 'floor_spike') {
          if (m.y > m.targetY) m.y -= 6; else m.y = m.targetY;
          if (player.alive && rectOverlap(player.x, player.y, CAT_W, CAT_H, m.x, m.y, m.w, m.h)) killPlayer();
        }
        if (m.type === 'button') {
          if (m.state === 'fly') {
            m.vy += 0.5; m.y += m.vy;
            // 落ちてくる ボタンに あたると しぬ
            if (player.alive && rectOverlap(player.x, player.y, CAT_W, CAT_H, m.x, m.y, m.w, m.h)) { killPlayer(); }
            if (m.y + m.h >= GY) {
              m.y = GY - m.h; m.state = 'ground';
              shakeTimer = 5; playTone(150, 'square', 0.16, 0.1);
            }
          } else if (m.state === 'ground' && !m.pressed) {
            // ふむと 左右が いれかわる
            if (player.alive && rectOverlap(player.x, player.y, CAT_W, CAT_H, m.x, m.y - 6, m.w, m.h + 6)) {
              m.pressed = true; m.h = 7; m.y = GY - 7;
              trap7.inverted = true;
              zones.push({ x1: 0, x2: worldWidth, type: 'reversed' });
              shakeTimer = 10; playError();
            }
          }
        }
        if (m.type === 'thwomp') {
          const pcx = player.x + CAT_W / 2, tcx = m.x + m.w / 2;
          if (m.state === 'idle' && Math.abs(pcx - tcx) < 1.6 * TILE && player.y > m.y) { m.state = 'fall'; m.vy = 14; }
          if (m.state === 'fall') {
            m.y += m.vy;
            if (m.y + m.h >= GY) { m.y = GY - m.h; m.state = 'wait'; m.waitTimer = 40; shakeTimer = 5; playTone(90, 'square', 0.2, 0.12); }
          }
          if (m.state === 'wait') { m.waitTimer--; if (m.waitTimer <= 0) m.state = 'rise'; }
          if (m.state === 'rise') { m.y -= 2; if (m.y <= m.baseY) { m.y = m.baseY; m.state = 'idle'; } }
          if (player.alive && rectOverlap(player.x + 2, player.y + 2, CAT_W - 4, CAT_H - 4, m.x, m.y, m.w, m.h)) killPlayer();
        }
      }
      for (const p of projectiles) {
        if (p.vx) p.x += p.vx;
        if (p.vy) p.y += p.vy;
        if (player.alive && rectOverlap(player.x, player.y, CAT_W, CAT_H, p.x, p.y, p.w, p.h)) killPlayer();
      }
      projectiles = projectiles.filter(p => p.y < canvas.height + 100 && p.x > -100 && p.x < worldWidth + 100);
      for (const b of platforms) {
        if (b.type === 'crush' && b.falling) {
          b.vy = (b.vy || 0) + 0.9; b.y += b.vy;
          if (b.y >= GY) { b.y = GY; b.falling = false; }
          if (player.alive && rectOverlap(player.x, player.y, CAT_W, CAT_H, b.x, b.y, b.w, b.h)) killPlayer();
        }
        if (b.type === 'dynamic') {
          if (b.falling) { b.vy = (b.vy || 0) + 0.7; b.y += b.vy; if (b.y > canvas.height + 200) b.visible = false; }
          if (b.flying) { b.x += b.flyVx; if (player.alive && rectOverlap(player.x, player.y, CAT_W, CAT_H, b.x, b.y, b.w, b.h)) killPlayer(); if (b.x > worldWidth + 200) b.visible = false; }
        }
        if (b.type === 'oscil') {
          b.phase += b.speed;
          if (b.axis === 'y') b.y = b.baseY + Math.sin(b.phase) * b.amp;
          if (b.axis === 'x') b.x = b.baseX + Math.sin(b.phase) * b.amp;
        }
      }
      for (const h of hazards) {
        if (h.type === 'roam_spike') { h.x += h.speed * h.dir; if (h.x <= h.minX || h.x + h.w >= h.maxX) h.dir *= -1; }
        if (h.type === 'chase_wall' && h.active) {
          h.x += h.speed;
          if (player.alive && rectOverlap(player.x, player.y, CAT_W, CAT_H, h.x, h.y, h.w, h.h)) killPlayer();
        }
      }
    }

    function updatePitSpikes() {
      for (const s of pitSpikes) { s.y += s.vy; if (player.alive && rectOverlap(player.x, player.y, CAT_W, CAT_H, s.x, s.y, s.w, s.h)) killPlayer(); }
      pitSpikes = pitSpikes.filter(s => s.y > -400);
    }

    function firePitSpike(cx, startY) {
      for (let i = -1; i <= 1; i++) pitSpikes.push({ x: cx + i * 14 - 5, y: startY, w: 10, h: 20, vy: -20 });
    }

    function rectOverlap(ax, ay, aw, ah, bx, by, bw, bh) { return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by; }

    function resolvePlatforms() {
      player.onGround = false;
      for (const b of platforms) {
        if (!b.visible) continue;
        if (b.type === 'fake_floor') continue;
        if (b.type === 'fake_wall') continue;
        if (b.type === 'crush' && b.falling && b.vy > 2) continue;
        if (b.type === 'dynamic' && (!b.visible || b.falling || b.flying)) continue;
        if (!rectOverlap(player.x, player.y, CAT_W, CAT_H, b.x, b.y, b.w, b.h)) continue;
        const ox = Math.min(player.x + CAT_W, b.x + b.w) - Math.max(player.x, b.x);
        const oy = Math.min(player.y + CAT_H, b.y + b.h) - Math.max(player.y, b.y);

        let resolveV = ox >= oy;
        // すり抜け防止: 落下中かつY軸のめり込みが浅い場合は優先的に上に乗せる
        if (b.type === 'oscil' && player.vy >= 0 && oy < 24) resolveV = true;

        if (resolveV) {
          const topThresh = b.type === 'oscil' ? 24 : 2;
          if (gravityDir === 1) {
            if (player.y + CAT_H - player.vy <= b.y + topThresh) { player.y = b.y - CAT_H; player.vy = 0; player.onGround = true; }
            else { player.y = b.y + b.h; player.vy = 2; if (b.type === 'qblock') bonkQBlock(b); }
          } else {
            // 反転重力: 天井ブロックの下面が「地面」
            if (player.y - player.vy >= b.y + b.h - topThresh) { player.y = b.y + b.h; player.vy = 0; player.onGround = true; }
            else { player.y = b.y - CAT_H; player.vy = -2; }
          }
        } else {
          if (player.x + CAT_W / 2 < b.x + b.w / 2) player.x = b.x - CAT_W; else player.x = b.x + b.w;
          player.vx = 0;
        }
      }
    }

    // 死亡・クリア
    const deathMsg = document.getElementById('deathMessage');
    const deathCountEl = document.getElementById('deathCount');
    const stageLabelEl = document.getElementById('stageLabel');

    const BUILDERS = { 1: buildStage1, 2: buildStage2, 3: buildStage3, 4: buildStage4, 5: buildStage5, 6: buildStage6, 7: buildStage7 };
    const TRAP_FNS = { 1: updateTraps1, 2: updateTraps2, 3: updateTraps3, 4: updateTraps4, 5: updateTraps5, 6: updateTraps6, 7: updateTraps7 };
    const SPAWNS = { 1: [60, 380], 2: [60, 380], 3: [60, 380], 4: [60, 380], 5: [17 * TILE, 380], 6: [60, 380], 7: [60, 380] };

    let deathTimer1 = null, deathTimer2 = null;
    function killPlayer() {
      if (!player.alive || IS_DEAD) return;
      playDeath();
      document.getElementById('bgm').pause(); // BGM停止
      player.alive = false; player.vx = 0; player.vy = -8;
      deathCount++; deathCountEl.textContent = '死亡 : ' + deathCount;
      IS_DEAD = true;
      deathMsg.textContent = diedInBattle ? 'ゲームは わらっている。' : (DEATH_MSGS[currentStage] || 'ハッ‥ハッ‥ハ・・・。');
      diedInBattle = false;
      deathMsg.classList.add('show');
      deathTimer1 = setTimeout(() => { deathMsg.classList.remove('show'); deathTimer2 = setTimeout(() => respawn(), 300); }, 1600);
    }
    function cancelPendingDeath() {
      clearTimeout(deathTimer1); clearTimeout(deathTimer2);
      IS_DEAD = false;
      deathMsg.classList.remove('show');
    }

    function respawn() {
      IS_DEAD = false; pitSpikes = []; projectiles = [];
      gravityDir = 1; activeMode = 'normal'; freezeTimer = 0; battleActive = false; battle = null;
      rhythmActive = false; rhythm = null; rhythmPresses = [];
      mgActive = false; mg = null;
      BUILDERS[currentStage]();
      if (currentStage === 5 && stage5Final) {
        applyFinalPhase();
        resetPlayer(78 * TILE, 380);
        snapCamera();
      } else {
        document.body.classList.remove('finalZone');
        const sp = SPAWNS[currentStage];
        resetPlayer(sp[0], sp[1]);
        camera.x = 0;
      }
      restartBgm(); // BGM再スタート
    }

      cancelPendingDeath();
      currentStage = n;
      stageLabelEl.textContent = 'STAGE ' + n;

      gravityDir = 1; activeMode = 'normal'; freezeTimer = 0; battleActive = false; battle = null;
      rhythmActive = false; rhythm = null; rhythmPresses = [];
      mgActive = false; mg = null;
      stage5Final = false;
      document.body.classList.remove('finalZone');
      BUILDERS[n]();
      const sp = SPAWNS[n];
      resetPlayer(sp[0], sp[1]);
      camera.x = 0; state = 'playing';
      setIntro(n);
    }

    function backToTitleFromSelect() {
